<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>固定費削減シミュレーター | AIアプリ工房</title>
  <meta name="description" content="スマホ・保険・サブスク・家賃・光熱費など月の固定費を項目ごとに入力し、収入に占める固定費率と削減効果を試算。家計見直しで年間いくら節約できるか即計算。無料・登録不要。">

  <meta property="og:title" content="固定費削減シミュレーター | AIアプリ工房">
  <meta property="og:description" content="スマホ・保険・サブスク・家賃・光熱費など月の固定費を項目ごとに入力し、収入に占める固定費率と削減効果を試算。家計見直しで年間いくら節約できるか即計算。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://yama-ai-factory.vercel.app/apps/fixed-cost-sim/">
  <meta name="twitter:card" content="summary">

  <script defer src="/_vercel/insights/script.js"></script>

  <style>
    :root {
      --bg:#07070f; --s1:#0e0e1a; --s2:#13131f; --bd:#22223a;
      --tx:#f0f0fa; --tx2:#6868a0; --tx3:#9090c0;
      --acc:#7c6ff5; --acc2:#a89cf7; --green:#34d399; --blue:#60a5fa;
      --yellow:#fbbf24; --red:#f87171;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background:var(--bg); color:var(--tx);
      font-family:'Segoe UI','Hiragino Sans','Yu Gothic UI',system-ui,sans-serif;
      min-height:100vh;
    }
    .wrapper { max-width:600px; margin:0 auto; padding:40px 20px 80px; }
    .back { font-size:.82rem; color:var(--tx2); text-decoration:none; display:inline-block; margin-bottom:28px; }
    .back:hover { color:var(--acc2); }
    .badge {
      display:inline-block; font-size:.72rem; font-weight:800; letter-spacing:.15em;
      text-transform:uppercase; color:var(--acc2);
      background:rgba(124,111,245,.15); border:1px solid rgba(124,111,245,.35);
      padding:4px 14px; border-radius:999px; margin-bottom:14px;
    }
    h1 { font-size:clamp(1.5rem,5vw,2.1rem); font-weight:900; line-height:1.3; margin-bottom:10px; }
    .grad { background:linear-gradient(135deg,#a89cf7,#60a5fa); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .subtitle { color:var(--tx3); font-size:.88rem; line-height:1.8; margin-bottom:28px; }

    .card { background:var(--s1); border:1px solid var(--bd); border-radius:16px; padding:24px 22px; margin-bottom:16px; }
    .card-title { font-size:.78rem; font-weight:700; color:var(--tx3); text-transform:uppercase; letter-spacing:.08em; margin-bottom:18px; }

    .field { margin-bottom:14px; }
    .field:last-child { margin-bottom:0; }
    .field label { display:block; font-size:.84rem; color:var(--tx3); font-weight:600; margin-bottom:6px; }
    .field label small { font-weight:400; font-size:.77rem; color:var(--tx2); margin-left:4px; }
    .input-row { display:flex; align-items:center; gap:10px; }
    input[type=number] {
      width:110px; padding:9px 12px; font-size:1rem; font-weight:700;
      background:var(--s2); border:1px solid var(--bd); border-radius:10px;
      color:var(--tx); outline:none; transition:border-color .15s; text-align:right;
      flex-shrink:0; -moz-appearance:textfield;
    }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { opacity:.4; }
    input[type=number]:focus { border-color:var(--acc); }
    .input-unit { font-size:.82rem; color:var(--tx2); white-space:nowrap; }
    .field-bar { height:4px; background:var(--bd); border-radius:2px; margin-top:8px; overflow:hidden; }
    .field-bar-fill { height:4px; border-radius:2px; background:var(--acc); transition:width .35s; width:0%; }

    .income-row { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
    .income-label { font-size:.95rem; font-weight:700; flex:1; min-width:120px; }

    input[type=range] { flex:1; accent-color:var(--acc); cursor:pointer; min-width:100px; }
    .range-val { font-size:1.1rem; font-weight:800; color:var(--acc2); min-width:44px; text-align:right; }

    /* result cards */
    .result-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:14px; }
    .res-card { background:var(--s2); border:1px solid var(--bd); border-radius:12px; padding:14px 16px; }
    .res-card .lbl { font-size:.73rem; color:var(--tx3); margin-bottom:4px; font-weight:600; }
    .res-card .val { font-size:1.25rem; font-weight:900; }
    .res-card .sub { font-size:.72rem; color:var(--tx2); margin-top:3px; }
    .val-green { color:var(--green); }
    .val-yellow { color:var(--yellow); }
    .val-red { color:var(--red); }
    .val-default { color:var(--tx); }

    .ratio-bar-wrap { background:var(--s2); border:1px solid var(--bd); border-radius:12px; padding:14px 16px; margin-bottom:14px; }
    .ratio-bar-header { display:flex; justify-content:space-between; font-size:.77rem; color:var(--tx3); margin-bottom:8px; }
    .ratio-bar-track { height:12px; background:var(--bd); border-radius:6px; overflow:hidden; }
    .ratio-bar-fill { height:12px; border-radius:6px; transition:width .4s, background .4s; width:0%; background:var(--acc); }
    .ratio-status { font-size:.82rem; font-weight:700; margin-top:8px; }

    .saving-box {
      background:rgba(52,211,153,.07); border:1px solid rgba(52,211,153,.22);
      border-radius:12px; padding:18px 16px; text-align:center; margin-bottom:14px;
    }
    .saving-box .main { font-size:1.45rem; font-weight:900; color:var(--green); }
    .saving-box .sub { font-size:.8rem; color:var(--tx3); margin-top:5px; }

    .btn-share {
      display:block; width:100%; padding:13px; border-radius:10px;
      background:var(--acc); color:#fff; font-size:1rem; font-weight:800;
      border:none; cursor:pointer; transition:opacity .15s;
    }
    .btn-share:hover { opacity:.85; }
    .disclaimer { font-size:.75rem; color:var(--tx2); text-align:center; margin-top:10px; line-height:1.7; }

    @media(max-width:520px) {
      .wrapper { padding:28px 14px 60px; }
      .result-grid { grid-template-columns:1fr 1fr; gap:10px; }
      input[type=number] { width:95px; font-size:.95rem; }
      .res-card .val { font-size:1.1rem; }
    }
  </style>
</head>
<body>
<div class="wrapper">
  <a class="back" href="/">← AIアプリ工房トップ</a>
  <div class="badge">Fixed Cost Sim</div>
  <h1>固定費削減<br><span class="grad">シミュレーター</span></h1>
  <p class="subtitle">月の固定費を項目ごとに入力すると、収入に占める固定費率と「○%削減で年間○万円節約できる」試算を即計算します。</p>

  <!-- 月収 -->
  <div class="card">
    <div class="card-title">月収(手取り)</div>
    <div class="income-row">
      <div class="income-label">月の手取り収入</div>
      <div class="input-row">
        <input type="number" id="income" value="250000" min="0" step="10000"
          onkeydown="if(event.key==='Enter')calculate();" oninput="calculate()">
        <span class="input-unit">円</span>
      </div>
    </div>
  </div>

  <!-- 固定費内訳 -->
  <div class="card">
    <div class="card-title">月の固定費 内訳</div>
    <div id="costFields"></div>
  </div>

  <!-- 削減シミュレーション -->
  <div class="card">
    <div class="card-title">削減シミュレーション</div>
    <div class="field">
      <label>固定費を一律 <span id="redPctLabel" style="color:var(--acc2);font-weight:800;">20%</span> 削減した場合</label>
      <div class="input-row" style="gap:14px;">
        <input type="range" id="redSlider" min="5" max="50" value="20" step="5"
          oninput="calculate()">
        <span class="range-val"><span id="redPctVal">20</span>%</span>
      </div>
    </div>
  </div>

  <!-- 結果 -->
  <div class="card" id="resultCard">
    <div class="card-title">計算結果</div>
    <div class="result-grid">
      <div class="res-card">
        <div class="lbl">月の固定費合計</div>
        <div class="val val-default" id="rMonthly">-</div>
        <div class="sub" id="rMonthlyYen"></div>
      </div>
      <div class="res-card">
        <div class="lbl">年間固定費</div>
        <div class="val val-default" id="rAnnual">-</div>
      </div>
      <div class="res-card">
        <div class="lbl">固定費率(収入比)</div>
        <div class="val" id="rRatio">-</div>
        <div class="sub" id="rRatioLbl"></div>
      </div>
      <div class="res-card">
        <div class="lbl">月の可処分所得</div>
        <div class="val val-default" id="rDisposable">-</div>
      </div>
    </div>

    <div class="ratio-bar-wrap">
      <div class="ratio-bar-header">
        <span>固定費</span>
        <span>可処分所得</span>
      </div>
      <div class="ratio-bar-track">
        <div class="ratio-bar-fill" id="ratioFill"></div>
      </div>
      <div class="ratio-status" id="ratioStatus"></div>
    </div>

    <div class="saving-box">
      <div class="main" id="rSaving">-</div>
      <div class="sub" id="rSavingSub"></div>
    </div>

    <button class="btn-share" onclick="shareX()">X(Twitter)でシェアする</button>
    <p class="disclaimer">※ 目安の試算です。実際の節約効果は個人の状況によって異なります。</p>
  </div>
</div>

<script>
const ITEMS = [
  { key:'rent',  label:'家賃・住居費',   hint:'マンション・アパート・ローン', def:80000 },
  { key:'util',  label:'光熱費',          hint:'電気・ガス・水道の合計',        def:12000 },
  { key:'phone', label:'スマホ代',        hint:'通信費・端末代含む',             def:8000  },
  { key:'ins',   label:'保険料',          hint:'生命・医療・火災等の合計',       def:15000 },
  { key:'sub',   label:'サブスク',        hint:'動画・音楽・AI・雑誌等',         def:5000  },
  { key:'car',   label:'車関連',          hint:'ローン・任意保険・駐車場',       def:0     },
  { key:'other', label:'その他固定費',    hint:'習い事・奨学金返済・定期代等',   def:0     },
];

(function buildFields() {
  const wrap = document.getElementById('costFields');
  ITEMS.forEach(item => {
    const d = document.createElement('div');
    d.className = 'field';
    d.innerHTML =
      '<label>' + item.label + '<small>' + item.hint + '</small></label>' +
      '<div class="input-row">' +
        '<input type="number" id="c_' + item.key + '" value="' + item.def + '" min="0" step="1000"' +
          ' onkeydown="if(event.key===\'Enter\')calculate();" oninput="calculate()">' +
        '<span class="input-unit">円</span>' +
      '</div>' +
      '<div class="field-bar"><div class="field-bar-fill" id="bar_' + item.key + '"></div></div>';
    wrap.appendChild(d);
  });
})();

function v(id) { return Math.max(0, parseFloat(document.getElementById(id).value) || 0); }

function fmtMan(n) {
  if (n >= 10000) return (Math.round(n / 1000) / 10) + '万円';
  return n.toLocaleString() + '円';
}

function fmtFull(n) { return n.toLocaleString() + '円'; }

function calculate() {
  const income = v('income');
  let total = 0;
  const vals = {};
  ITEMS.forEach(function(item) {
    var x = v('c_' + item.key);
    vals[item.key] = x;
    total += x;
  });

  // per-category proportion bars
  ITEMS.forEach(function(item) {
    var pct = total > 0 ? Math.min(100, vals[item.key] / total * 100) : 0;
    document.getElementById('bar_' + item.key).style.width = pct.toFixed(1) + '%';
  });

  var annual = total * 12;
  var ratio = income > 0 ? total / income * 100 : 0;
  var disposable = Math.max(0, income - total);

  document.getElementById('rMonthly').textContent = fmtMan(total);
  document.getElementById('rAnnual').textContent = fmtMan(annual);
  document.getElementById('rDisposable').textContent = fmtMan(disposable);

  // ratio coloring
  var ratioEl = document.getElementById('rRatio');
  var ratioLbl = document.getElementById('rRatioLbl');
  var ratioFill = document.getElementById('ratioFill');
  var ratioStatus = document.getElementById('ratioStatus');

  ratioEl.textContent = ratio.toFixed(1) + '%';
  ratioFill.style.width = Math.min(100, ratio).toFixed(1) + '%';

  if (ratio < 40) {
    ratioEl.className = 'val val-green';
    ratioFill.style.background = 'var(--green)';
    ratioLbl.textContent = '良好';
    ratioStatus.textContent = '固定費率が40%未満で良好です。可処分所得に余裕があります。';
    ratioStatus.style.color = 'var(--green)';
  } else if (ratio < 55) {
    ratioEl.className = 'val val-yellow';
    ratioFill.style.background = 'var(--yellow)';
    ratioLbl.textContent = '注意';
    ratioStatus.textContent = '固定費率がやや高めです。スマホ・サブスク・保険の見直しを検討しましょう。';
    ratioStatus.style.color = 'var(--yellow)';
  } else {
    ratioEl.className = 'val val-red';
    ratioFill.style.background = 'var(--red)';
    ratioLbl.textContent = '危険';
    ratioStatus.textContent = '固定費が収入の過半数を超えています。早急な家計見直しをおすすめします。';
    ratioStatus.style.color = 'var(--red)';
  }

  // reduction simulation
  var redPct = parseInt(document.getElementById('redSlider').value) || 20;
  document.getElementById('redPctLabel').textContent = redPct + '%';
  document.getElementById('redPctVal').textContent = redPct;

  var monthlySave = Math.round(total * redPct / 100);
  var annualSave = monthlySave * 12;

  document.getElementById('rSaving').textContent = '年間 ' + fmtMan(annualSave) + ' 節約できます';
  document.getElementById('rSavingSub').textContent =
    '固定費を' + redPct + '%削減した場合: 月' + fmtFull(monthlySave) + ' / 年' + fmtFull(annualSave) + 'の節約';
}

function shareX() {
  var income = v('income');
  var total = 0;
  ITEMS.forEach(function(item) { total += v('c_' + item.key); });
  var ratio = income > 0 ? (total / income * 100).toFixed(1) : '-';
  var redPct = parseInt(document.getElementById('redSlider').value) || 20;
  var annualSave = Math.round(total * redPct / 100) * 12;

  var text =
    '固定費削減シミュレーターで家計を試算しました。\n' +
    '月の固定費合計: ' + total.toLocaleString() + '円 / 固定費率: ' + ratio + '%\n' +
    redPct + '%削減すると年間' + annualSave.toLocaleString() + '円の節約になります！\n' +
    '#AIアプリ工房\nhttps://yama-ai-factory.vercel.app/apps/fixed-cost-sim/';
  window.open('https://x.com/intent/tweet?text=' + encodeURIComponent(text), '_blank');
}

calculate();
</script>
</body>
</html>
