<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日焼けタイム計算機 | 肌タイプ・UV指数・SPFで日焼けまでの時間を計算</title>
  <meta name="description" content="肌タイプ(I〜VI)・UV指数・日焼け止めのSPFを入力するだけで、無防備で日焼けする目安時間とSPF使用後の保護時間を計算。夏の外出前の紫外線対策に。無料・登録不要。">
  <meta property="og:title" content="日焼けタイム計算機 | 肌タイプ・UV指数・SPFで日焼けまでの時間を計算">
  <meta property="og:description" content="肌タイプ・UV指数・SPFから日焼けまでの目安時間を計算。夏の紫外線対策に。無料・登録不要。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://yama-ai-factory.vercel.app/apps/sunburn-timer/">
  <meta name="twitter:card" content="summary">
  <script defer src="/_vercel/insights/script.js"></script>
  <style>
    :root {
      --bg:#07070f; --s1:#0e0e1a; --s2:#13131f; --bd:#22223a;
      --tx:#f0f0fa; --tx2:#6868a0; --tx3:#9090c0;
      --acc:#7c6ff5; --acc2:#a89cf7; --green:#34d399; --blue:#60a5fa; --red:#f87171; --amber:#fbbf24;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background:var(--bg); color:var(--tx);
      font-family:'Segoe UI','Hiragino Sans','Yu Gothic UI',system-ui,sans-serif;
      min-height:100vh;
    }
    .wrapper { max-width:560px; margin:0 auto; padding:40px 20px 80px; }
    .back-link {
      display:inline-block; font-size:.82rem; color:var(--tx2);
      text-decoration:none; margin-bottom:28px; transition:color .15s;
    }
    .back-link:hover { color:var(--acc2); }
    .badge {
      display:inline-block; font-size:.72rem; font-weight:800; letter-spacing:.15em;
      text-transform:uppercase; color:var(--acc2);
      background:rgba(124,111,245,.15); border:1px solid rgba(124,111,245,.35);
      padding:4px 14px; border-radius:999px; margin-bottom:14px;
    }
    h1 { font-size:clamp(1.6rem,5vw,2.2rem); font-weight:900; line-height:1.3; margin-bottom:10px; }
    .grad { background:linear-gradient(135deg,#a89cf7,#60a5fa); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .hero-desc { color:var(--tx3); font-size:.9rem; line-height:1.8; margin-bottom:32px; }
    .card { background:var(--s1); border:1px solid var(--bd); border-radius:16px; padding:24px; margin-bottom:16px; }
    .section-title { font-size:.78rem; color:var(--tx2); font-weight:700; letter-spacing:.08em; text-transform:uppercase; margin-bottom:14px; }

    .skin-group { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; }
    .seg-group { display:flex; gap:8px; flex-wrap:wrap; }
    .seg-btn {
      padding:10px 8px; border-radius:10px; cursor:pointer;
      font-size:.86rem; font-weight:700; border:1px solid var(--bd);
      background:var(--s2); color:var(--tx3); transition:all .15s;
      text-align:center; line-height:1.5;
    }
    .seg-group .seg-btn { flex:1; min-width:60px; }
    .seg-btn.active { background:rgba(124,111,245,.18); border-color:var(--acc); color:var(--acc2); }
    .seg-btn:hover:not(.active) { border-color:var(--tx2); color:var(--tx); }
    .seg-sub { font-size:.68rem; font-weight:400; color:var(--tx2); display:block; margin-top:2px; }
    .seg-btn.active .seg-sub { color:var(--acc2); opacity:.7; }

    .field-row { display:flex; align-items:center; gap:12px; }
    .field-adj {
      width:44px; height:44px; border-radius:10px; border:1px solid var(--bd);
      background:var(--s2); color:var(--tx); font-size:1.5rem;
      cursor:pointer; display:flex; align-items:center; justify-content:center;
      flex-shrink:0; transition:border-color .15s; user-select:none;
    }
    .field-adj:hover { border-color:var(--acc); color:var(--acc2); }
    .field-input {
      flex:1; padding:10px 14px; font-size:2rem; font-weight:900;
      background:var(--s2); border:1px solid var(--bd); border-radius:10px;
      color:var(--tx); outline:none; transition:border-color .15s; text-align:center;
    }
    .field-input:focus { border-color:var(--acc); }

    .uv-badge-wrap { margin-top:10px; text-align:center; }
    .uv-badge {
      display:inline-block; padding:4px 14px; border-radius:999px;
      font-size:.78rem; font-weight:700;
    }
    .uv-low  { background:rgba(52,211,153,.12); color:var(--green); border:1px solid rgba(52,211,153,.3); }
    .uv-mod  { background:rgba(251,191,36,.12);  color:var(--amber); border:1px solid rgba(251,191,36,.3); }
    .uv-high { background:rgba(248,113,113,.12); color:var(--red);   border:1px solid rgba(248,113,113,.3); }

    .result-main { text-align:center; padding:18px 0 16px; border-bottom:1px solid var(--bd); margin-bottom:18px; }
    .result-label { font-size:.82rem; color:var(--tx3); margin-bottom:10px; }
    .result-time-big { font-size:2.6rem; font-weight:900; margin-bottom:8px; line-height:1.1; }
    .result-time-big.safe   { color:var(--green); }
    .result-time-big.caution { color:var(--amber); }
    .result-time-big.danger  { color:var(--red); }
    .result-spf-line { font-size:.9rem; color:var(--tx3); }
    .result-spf-line strong { color:var(--blue); }

    .result-rows { display:grid; gap:12px; }
    .result-row { display:flex; justify-content:space-between; align-items:center; gap:12px; }
    .result-name { font-size:.86rem; color:var(--tx3); }
    .result-val { font-size:.9rem; font-weight:800; color:var(--blue); text-align:right; }

    .rec-box { margin-top:18px; padding:14px; background:var(--s2); border-radius:10px; border-left:3px solid var(--acc); }
    .rec-title { font-size:.72rem; color:var(--acc2); font-weight:700; letter-spacing:.08em; text-transform:uppercase; margin-bottom:6px; }
    .rec-text { font-size:.84rem; color:var(--tx3); line-height:1.8; }

    .placeholder { color:var(--tx2); text-align:center; padding:8px 0; font-size:.88rem; }
    .disclaimer {
      font-size:.74rem; color:var(--tx2); line-height:1.75;
      padding:10px 12px; background:var(--s2); border-radius:8px;
      border-left:3px solid var(--bd); margin-bottom:14px;
    }
    .share-row { display:flex; gap:10px; }
    .share-btn {
      flex:1; padding:11px; border-radius:10px; cursor:pointer;
      font-size:.88rem; font-weight:700; border:none; transition:opacity .15s;
    }
    .share-x    { background:#000; color:#fff; border:1px solid #2a2a2a; }
    .share-copy { background:var(--s2); color:var(--tx); border:1px solid var(--bd); }
    .share-btn:hover:not(:disabled) { opacity:.8; }
    .share-btn:disabled { opacity:.35; cursor:not-allowed; }

    @media (max-width:520px) {
      .wrapper { padding:24px 14px 60px; }
      .seg-btn { font-size:.8rem; padding:9px 6px; }
      .result-time-big { font-size:2rem; }
    }
  </style>
</head>
<body>
<div class="wrapper">
  <a class="back-link" href="/">&larr; AIアプリ工房に戻る</a>

  <div class="badge">Sunburn Timer</div>
  <h1><span class="grad">日焼けタイム</span>計算機</h1>
  <p class="hero-desc">肌タイプ・UV指数・日焼け止めのSPFから、日焼けまでの目安時間を計算します。<br>夏の外出前や日焼け止め選びの参考にどうぞ。</p>

  <div class="card">
    <div class="section-title">肌タイプ</div>
    <div class="skin-group" id="skinGroup">
      <button class="seg-btn" onclick="setSkin('I', this)">タイプ I<span class="seg-sub">非常に白い / 常に赤くなる</span></button>
      <button class="seg-btn active" onclick="setSkin('II', this)">タイプ II<span class="seg-sub">白い / よく赤くなる</span></button>
      <button class="seg-btn" onclick="setSkin('III', this)">タイプ III<span class="seg-sub">普通 / たまに赤くなる</span></button>
      <button class="seg-btn" onclick="setSkin('IV', this)">タイプ IV<span class="seg-sub">やや浅黒い / あまり赤くならない</span></button>
      <button class="seg-btn" onclick="setSkin('V', this)">タイプ V<span class="seg-sub">茶色い / ほぼ赤くならない</span></button>
      <button class="seg-btn" onclick="setSkin('VI', this)">タイプ VI<span class="seg-sub">黒い / 赤くならない</span></button>
    </div>
  </div>

  <div class="card">
    <div class="section-title">現在のUV指数</div>
    <div class="field-row">
      <button class="field-adj" onclick="adjustUV(-1)">-</button>
      <input type="number" id="uvInput" class="field-input" min="1" max="14" value="8"
        onkeydown="if(event.key==='Enter')calculate();" oninput="calculate()">
      <button class="field-adj" onclick="adjustUV(1)">+</button>
    </div>
    <div class="uv-badge-wrap" id="uvLevelWrap"></div>
  </div>

  <div class="card">
    <div class="section-title">日焼け止めのSPF</div>
    <div class="seg-group" id="spfGroup">
      <button class="seg-btn" onclick="setSpf(1, this)">なし</button>
      <button class="seg-btn" onclick="setSpf(15, this)">SPF 15</button>
      <button class="seg-btn active" onclick="setSpf(30, this)">SPF 30</button>
      <button class="seg-btn" onclick="setSpf(50, this)">SPF 50</button>
      <button class="seg-btn" onclick="setSpf(60, this)">SPF 50+</button>
    </div>
  </div>

  <div class="card" id="resultCard">
    <div class="placeholder">上の条件を入力すると結果が表示されます</div>
  </div>

  <div class="card">
    <div class="disclaimer">この計算はWHO・環境省等の研究に基づく目安です。実際の日焼け時間は気温・雲量・地面や水面の反射・汗や水による日焼け止めの落ち方によって大きく変わります。医療的助言ではありません。皮膚に異常を感じたら皮膚科を受診してください。</div>
    <div class="share-row">
      <button class="share-btn share-x" id="btn-x" onclick="doShareX()" disabled>X でシェア</button>
      <button class="share-btn share-copy" id="btn-copy" onclick="doCopy(this)" disabled>結果をコピー</button>
    </div>
  </div>
</div>

<script>
var selectedSkin = 'II';
var selectedSpf = 30;
var lastResult = null;

var SKIN_MED = { 'I': 67, 'II': 100, 'III': 150, 'IV': 200, 'V': 267, 'VI': 400 };
var SKIN_LABEL = {
  'I':   'タイプ I (非常に白い肌)',
  'II':  'タイプ II (白い肌)',
  'III': 'タイプ III (普通の肌)',
  'IV':  'タイプ IV (やや浅黒い肌)',
  'V':   'タイプ V (茶色い肌)',
  'VI':  'タイプ VI (黒い肌)'
};

function setSkin(type, btn) {
  selectedSkin = type;
  document.querySelectorAll('#skinGroup .seg-btn').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
  calculate();
}

function setSpf(spf, btn) {
  selectedSpf = spf;
  document.querySelectorAll('#spfGroup .seg-btn').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
  calculate();
}

function adjustUV(delta) {
  var input = document.getElementById('uvInput');
  var val = parseInt(input.value, 10);
  if (isNaN(val)) val = 8;
  val = Math.max(1, Math.min(14, val + delta));
  input.value = val;
  calculate();
}

function uvInfo(uv) {
  if (uv <= 2)  return { label: '低い',         cls: 'uv-low' };
  if (uv <= 5)  return { label: '中程度',        cls: 'uv-mod' };
  if (uv <= 7)  return { label: '高い',          cls: 'uv-mod' };
  if (uv <= 10) return { label: '非常に高い',    cls: 'uv-high' };
  return             { label: '極端に強い',   cls: 'uv-high' };
}

function formatTime(mins) {
  if (mins < 1)   return '1分未満';
  if (mins < 60)  return '約' + Math.round(mins) + '分';
  var h = Math.floor(mins / 60);
  var m = Math.round(mins % 60);
  if (m === 0) return '約' + h + '時間';
  return '約' + h + '時間' + m + '分';
}

function riskClass(mins) {
  if (mins < 15) return 'danger';
  if (mins < 30) return 'caution';
  return 'safe';
}

function getRecommendation(unprotectedMins) {
  if (unprotectedMins < 10) {
    return '非常に短時間で日焼けする条件です。日焼け止めは必須で、帽子・日傘・UV遮断素材の衣類を組み合わせた多重対策をお勧めします。SPF 50以上の日焼け止めを選び、2時間おきに塗り直してください。';
  }
  if (unprotectedMins < 20) {
    return '短時間で日焼けしやすい条件です。日焼け止めに加え、帽子や長袖での物理的な遮蔽が有効です。汗や水で落ちやすいため、2〜3時間おきに塗り直しましょう。';
  }
  if (unprotectedMins < 45) {
    return '適切な日焼け止めを使用すれば比較的安全に過ごせます。汗や水で日焼け止め効果は低下するため、こまめな塗り直しをお忘れなく。';
  }
  return '比較的日焼けしにくい条件ですが、長時間の屋外活動には日焼け止めの使用をお勧めします。';
}

function calculate() {
  var raw = parseFloat(document.getElementById('uvInput').value);
  if (isNaN(raw) || raw < 1) {
    document.getElementById('resultCard').innerHTML = '<div class="placeholder">UV指数を入力してください</div>';
    document.getElementById('uvLevelWrap').innerHTML = '';
    document.getElementById('btn-x').disabled = true;
    document.getElementById('btn-copy').disabled = true;
    lastResult = null;
    return;
  }
  var uv = Math.max(1, Math.min(14, raw));
  var info = uvInfo(uv);
  document.getElementById('uvLevelWrap').innerHTML =
    '<span class="uv-badge ' + info.cls + '">UV ' + uv + ' — ' + info.label + '</span>';

  var med = SKIN_MED[selectedSkin];
  var unprotectedMins = med / uv;
  var protectedMins   = (med * selectedSpf) / uv;
  var allDay = protectedMins > 14 * 60;

  var spfLabel = selectedSpf === 1 ? 'なし' : (selectedSpf === 60 ? 'SPF 50+' : 'SPF ' + selectedSpf);

  lastResult = {
    uv: uv, uvLabel: info.label,
    skin: selectedSkin, skinLabel: SKIN_LABEL[selectedSkin],
    spf: selectedSpf, spfLabel: spfLabel,
    unprotectedMins: unprotectedMins, protectedMins: protectedMins, allDay: allDay,
    unprotectedStr: formatTime(unprotectedMins),
    protectedStr: allDay ? '日中ほぼ保護' : formatTime(protectedMins)
  };

  var rc = riskClass(unprotectedMins);
  var h = '';

  h += '<div class="result-main">';
  h += '<div class="result-label">日焼け止めなしでの日焼けまでの目安</div>';
  h += '<div class="result-time-big ' + rc + '">' + formatTime(unprotectedMins) + '</div>';
  if (selectedSpf > 1) {
    h += '<div class="result-spf-line">' + spfLabel + ' 使用時: <strong>' + (allDay ? '日中ほぼ保護' : formatTime(protectedMins)) + '</strong></div>';
  }
  h += '</div>';

  h += '<div class="result-rows">';
  h += '<div class="result-row"><span class="result-name">肌タイプ</span><span class="result-val">' + SKIN_LABEL[selectedSkin] + '</span></div>';
  h += '<div class="result-row"><span class="result-name">UV指数</span><span class="result-val">' + uv + '&nbsp;(' + info.label + ')</span></div>';
  h += '<div class="result-row"><span class="result-name">日焼け止め</span><span class="result-val">' + spfLabel + '</span></div>';
  if (selectedSpf > 1) {
    h += '<div class="result-row"><span class="result-name">SPF使用後の保護時間</span><span class="result-val">' + (allDay ? '日中ほぼ保護' : formatTime(protectedMins)) + '</span></div>';
  }
  h += '</div>';

  h += '<div class="rec-box"><div class="rec-title">対策のポイント</div><div class="rec-text">' + getRecommendation(unprotectedMins) + '</div></div>';

  document.getElementById('resultCard').innerHTML = h;
  document.getElementById('btn-x').disabled = false;
  document.getElementById('btn-copy').disabled = false;
}

function buildShareText() {
  var r = lastResult;
  if (!r) return '';
  var lines = [
    '【日焼けタイム計算】',
    '肌タイプ: ' + r.skin + ' / UV指数: ' + r.uv + ' (' + r.uvLabel + ') / 日焼け止め: ' + r.spfLabel,
    '無防備での日焼けまで: ' + r.unprotectedStr
  ];
  if (r.spf > 1) {
    lines.push(r.spfLabel + ' 使用後: ' + r.protectedStr);
  }
  lines.push('');
  lines.push('#日焼け対策 #紫外線対策 #AIアプリ工房');
  lines.push('https://yama-ai-factory.vercel.app/apps/sunburn-timer/');
  return lines.join('\n');
}

function doShareX() {
  if (!lastResult) return;
  window.open('https://x.com/intent/tweet?text=' + encodeURIComponent(buildShareText()), '_blank', 'noopener');
}

function doCopy(btn) {
  if (!lastResult) return;
  var text = buildShareText();
  var orig = btn.textContent;
  function done() { btn.textContent = 'コピーしました'; setTimeout(function() { btn.textContent = orig; }, 2000); }
  function fallback() {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    done();
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(fallback);
  } else { fallback(); }
}

calculate();
</script>
</body>
</html>
