<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スマホプラン乗り換え 損益分岐点計算機 | AIアプリ工房</title>
  <meta name="description" content="現プランの月額・新プランの月額・解約違約金・端末購入費を入力し「何ヶ月で元が取れるか」を計算。格安SIM乗り換えや大手キャリア間の比較に。無料・登録不要。">

  <meta property="og:title" content="スマホプラン乗り換え 損益分岐点計算機 | AIアプリ工房">
  <meta property="og:description" content="現プランの月額・新プランの月額・解約違約金・端末購入費を入力すると「何ヶ月で元が取れるか」を即計算。格安SIM乗り換えの判断に。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://yama-ai-factory.vercel.app/apps/smartphone-switch/">
  <meta name="twitter:card" content="summary">

  <script defer src="/_vercel/insights/script.js"></script>

  <style>
    :root {
      --bg:#07070f; --s1:#0e0e1a; --s2:#13131f; --bd:#22223a;
      --tx:#f0f0fa; --tx2:#6868a0; --tx3:#9090c0;
      --acc:#7c6ff5; --acc2:#a89cf7; --green:#34d399; --blue:#60a5fa;
      --red:#f87171; --yellow:#fbbf24;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background:var(--bg); color:var(--tx);
      font-family:'Segoe UI','Hiragino Sans','Yu Gothic UI',system-ui,sans-serif;
      min-height:100vh;
    }
    .wrapper { max-width:600px; margin:0 auto; padding:40px 20px 80px; }
    .back { font-size:.82rem; color:var(--tx2); text-decoration:none; display:inline-block; margin-bottom:28px; }
    .back:hover { color:var(--acc2); }
    .badge {
      display:inline-block; font-size:.72rem; font-weight:800; letter-spacing:.15em;
      text-transform:uppercase; color:var(--acc2);
      background:rgba(124,111,245,.15); border:1px solid rgba(124,111,245,.35);
      padding:4px 14px; border-radius:999px; margin-bottom:14px;
    }
    h1 { font-size:clamp(1.4rem,5vw,2rem); font-weight:900; line-height:1.3; margin-bottom:10px; }
    .grad { background:linear-gradient(135deg,#a89cf7,#60a5fa); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .subtitle { color:var(--tx3); font-size:.88rem; line-height:1.8; margin-bottom:28px; }

    .card { background:var(--s1); border:1px solid var(--bd); border-radius:16px; padding:24px 22px; margin-bottom:16px; }
    .card-title { font-size:.78rem; font-weight:700; color:var(--tx3); text-transform:uppercase; letter-spacing:.08em; margin-bottom:18px; }

    .field { margin-bottom:16px; }
    .field:last-child { margin-bottom:0; }
    .field label { display:block; font-size:.84rem; color:var(--tx3); font-weight:600; margin-bottom:6px; }
    .field label .opt { font-size:.75rem; color:var(--tx2); font-weight:400; margin-left:4px; }
    .input-wrap { display:flex; align-items:center; gap:10px; }
    input[type=number] {
      flex:1; background:var(--s2); border:1.5px solid var(--bd); border-radius:10px;
      color:var(--tx); padding:11px 14px; font-size:1rem;
      outline:none; transition:border-color .15s;
      -moz-appearance:textfield;
    }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance:none; }
    input[type=number]:focus { border-color:var(--acc); }
    .unit { font-size:.82rem; color:var(--tx2); white-space:nowrap; min-width:24px; }

    .result-hero {
      text-align:center; padding:20px 0 16px;
    }
    .result-label { font-size:.82rem; color:var(--tx3); margin-bottom:8px; }
    .result-months {
      font-size:3rem; font-weight:900; line-height:1;
      background:linear-gradient(135deg,#a89cf7,#60a5fa);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    }
    .result-months-unit { font-size:1.2rem; font-weight:700; color:var(--tx); margin-top:4px; }
    .result-impossible { font-size:1.3rem; font-weight:800; color:var(--red); }
    .result-free { font-size:1.6rem; font-weight:900; color:var(--green); }

    .stat-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px; }
    .stat-box {
      background:var(--s2); border:1px solid var(--bd); border-radius:12px;
      padding:14px 16px;
    }
    .stat-box .sl { font-size:.75rem; color:var(--tx3); margin-bottom:6px; }
    .stat-box .sv { font-size:1.05rem; font-weight:800; }
    .stat-box .sv.saving { color:var(--green); }
    .stat-box .sv.cost { color:var(--red); }
    .stat-box .sv.neutral { color:var(--tx2); }

    .timeline { margin-top:20px; }
    .tl-row { display:flex; align-items:center; gap:12px; margin-bottom:10px; }
    .tl-row:last-child { margin-bottom:0; }
    .tl-month { font-size:.78rem; color:var(--tx3); min-width:52px; text-align:right; }
    .tl-bar-wrap { flex:1; background:var(--s2); border-radius:999px; height:8px; overflow:hidden; }
    .tl-bar { height:100%; border-radius:999px; transition:width .4s; }
    .tl-bar.negative { background:var(--red); }
    .tl-bar.zero { background:var(--yellow); }
    .tl-bar.positive { background:var(--green); }
    .tl-val { font-size:.78rem; font-weight:700; min-width:80px; text-align:right; }
    .tl-val.neg { color:var(--red); }
    .tl-val.zer { color:var(--yellow); }
    .tl-val.pos { color:var(--green); }

    .btn {
      display:inline-flex; align-items:center; gap:8px;
      padding:12px 22px; border-radius:10px; font-weight:700; font-size:.88rem;
      cursor:pointer; border:none; transition:all .15s; text-decoration:none;
    }
    .btn-primary { background:var(--acc); color:#fff; }
    .btn-primary:hover { background:#6a5fe0; }
    .btn-row { display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }

    .note { font-size:.74rem; color:var(--tx2); line-height:1.7; margin-top:12px; padding-top:12px; border-top:1px solid var(--bd); }

    footer { margin-top:48px; padding-top:20px; border-top:1px solid var(--bd); text-align:center; font-size:.78rem; color:var(--tx2); line-height:2; }
    footer a { color:var(--acc2); text-decoration:none; }

    @media (max-width:520px) {
      .wrapper { padding:28px 14px 60px; }
      .stat-grid { grid-template-columns:1fr; }
      .result-months { font-size:2.4rem; }
    }
  </style>
</head>
<body>
<div class="wrapper">
  <a class="back" href="/">&larr; AIアプリ工房</a>
  <div class="badge">Smartphone Switch</div>
  <h1><span class="grad">スマホプラン乗り換え</span><br>損益分岐点計算機</h1>
  <p class="subtitle">現プランと新プランの月額・初期費用を入力するだけで<br>「何ヶ月で元が取れるか」を即計算します。</p>

  <div class="card">
    <div class="card-title">プラン情報を入力</div>

    <div class="field">
      <label>現プランの月額</label>
      <div class="input-wrap">
        <input type="number" id="currentPlan" value="8000" min="0" max="99999" step="100"
          oninput="calculate()" onkeydown="if(event.key==='Enter')calculate();"
          onfocus="this.select();">
        <span class="unit">円/月</span>
      </div>
    </div>

    <div class="field">
      <label>新プランの月額</label>
      <div class="input-wrap">
        <input type="number" id="newPlan" value="3000" min="0" max="99999" step="100"
          oninput="calculate()" onkeydown="if(event.key==='Enter')calculate();"
          onfocus="this.select();">
        <span class="unit">円/月</span>
      </div>
    </div>

    <div class="field">
      <label>解約違約金 <span class="opt">(任意・なければ 0)</span></label>
      <div class="input-wrap">
        <input type="number" id="cancelFee" value="0" min="0" max="999999" step="100"
          oninput="calculate()" onkeydown="if(event.key==='Enter')calculate();"
          onfocus="this.select();">
        <span class="unit">円</span>
      </div>
    </div>

    <div class="field">
      <label>端末購入費 <span class="opt">(任意・なければ 0)</span></label>
      <div class="input-wrap">
        <input type="number" id="deviceCost" value="0" min="0" max="9999999" step="1000"
          oninput="calculate()" onkeydown="if(event.key==='Enter')calculate();"
          onfocus="this.select();">
        <span class="unit">円</span>
      </div>
    </div>
  </div>

  <div class="card" id="resultCard">
    <div class="card-title">計算結果</div>

    <div class="result-hero">
      <div class="result-label">損益分岐点</div>
      <div id="resultMonths" class="result-months">--</div>
      <div class="result-months-unit" id="resultUnit"></div>
    </div>

    <div class="stat-grid">
      <div class="stat-box">
        <div class="sl">月額差(節約額)</div>
        <div class="sv" id="statDiff">--</div>
      </div>
      <div class="stat-box">
        <div class="sl">初期費用合計</div>
        <div class="sv" id="statInitial">--</div>
      </div>
      <div class="stat-box">
        <div class="sl">1年後の累計損益</div>
        <div class="sv" id="statYear1">--</div>
      </div>
      <div class="stat-box">
        <div class="sl">2年後の累計損益</div>
        <div class="sv" id="statYear2">--</div>
      </div>
    </div>

    <div class="timeline" id="timeline" hidden>
      <div style="font-size:.78rem;color:var(--tx3);margin-bottom:12px;margin-top:16px;">累計損益の推移</div>
      <div id="tlRows"></div>
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" id="shareBtn" onclick="share()">Xでシェア</button>
    </div>

    <div class="note">
      計算結果はあくまで目安です。実際の乗り換えにあたっては、各キャリアの公式サイトや店舗にてご確認ください。
    </div>
  </div>

  <footer>
    <a href="/">AIアプリ工房トップへ</a>
  </footer>
</div>

<script>
  function fmt(n) {
    return Math.round(Math.abs(n)).toLocaleString('ja-JP') + '円';
  }

  function fmtSigned(n) {
    var abs = Math.round(Math.abs(n)).toLocaleString('ja-JP');
    if (n > 0) return '+' + abs + '円';
    if (n < 0) return '-' + abs + '円';
    return '0円';
  }

  function calculate() {
    var cur = parseFloat(document.getElementById('currentPlan').value) || 0;
    var nxt = parseFloat(document.getElementById('newPlan').value) || 0;
    var cancel = parseFloat(document.getElementById('cancelFee').value) || 0;
    var device = parseFloat(document.getElementById('deviceCost').value) || 0;

    var initialCost = cancel + device;
    var diff = cur - nxt;

    var elMonths = document.getElementById('resultMonths');
    var elUnit = document.getElementById('resultUnit');
    var elDiff = document.getElementById('statDiff');
    var elInitial = document.getElementById('statInitial');
    var elYear1 = document.getElementById('statYear1');
    var elYear2 = document.getElementById('statYear2');
    var elTl = document.getElementById('timeline');
    var elTlRows = document.getElementById('tlRows');

    elInitial.textContent = fmt(initialCost);
    elInitial.className = 'sv' + (initialCost > 0 ? ' cost' : ' neutral');

    if (diff <= 0) {
      elMonths.className = 'result-impossible';
      elMonths.textContent = '元は取れません';
      elUnit.textContent = '新プランの方が月額が高いため、乗り換えると損になります。';
      elDiff.textContent = fmtSigned(-diff) + '/月 割高';
      elDiff.className = 'sv cost';
      elYear1.textContent = fmtSigned(diff * 12 - initialCost);
      elYear1.className = 'sv cost';
      elYear2.textContent = fmtSigned(diff * 24 - initialCost);
      elYear2.className = 'sv cost';
      elTl.hidden = true;
      return;
    }

    if (initialCost === 0) {
      elMonths.className = 'result-free';
      elMonths.textContent = '即日お得';
      elUnit.textContent = '初期費用なしで月額が下がります。';
    } else {
      var months = Math.ceil(initialCost / diff);
      elMonths.className = 'result-months';
      elMonths.textContent = months;
      elUnit.textContent = 'ヶ月後に元が取れます';
    }

    elDiff.textContent = fmt(diff) + '/月 節約';
    elDiff.className = 'sv saving';

    var y1 = diff * 12 - initialCost;
    var y2 = diff * 24 - initialCost;
    elYear1.textContent = fmtSigned(y1);
    elYear1.className = 'sv ' + (y1 >= 0 ? 'saving' : 'cost');
    elYear2.textContent = fmtSigned(y2);
    elYear2.className = 'sv ' + (y2 >= 0 ? 'saving' : 'cost');

    var checkpoints = [6, 12, 18, 24];
    var maxVal = diff * 24;
    var minVal = -initialCost;
    var range = maxVal - minVal || 1;

    elTlRows.innerHTML = '';
    checkpoints.forEach(function(m) {
      var val = diff * m - initialCost;
      var div = document.createElement('div');
      div.className = 'tl-row';

      var pct = Math.max(0, Math.min(100, (val - minVal) / range * 100));
      var barClass = val < 0 ? 'negative' : (val === 0 ? 'zero' : 'positive');
      var valClass = val < 0 ? 'neg' : (val === 0 ? 'zer' : 'pos');

      div.innerHTML =
        '<div class="tl-month">' + m + 'ヶ月後</div>' +
        '<div class="tl-bar-wrap"><div class="tl-bar ' + barClass + '" style="width:' + pct.toFixed(1) + '%"></div></div>' +
        '<div class="tl-val ' + valClass + '">' + fmtSigned(val) + '</div>';
      elTlRows.appendChild(div);
    });
    elTl.hidden = false;
  }

  function share() {
    var cur = parseFloat(document.getElementById('currentPlan').value) || 0;
    var nxt = parseFloat(document.getElementById('newPlan').value) || 0;
    var cancel = parseFloat(document.getElementById('cancelFee').value) || 0;
    var device = parseFloat(document.getElementById('deviceCost').value) || 0;

    var initialCost = cancel + device;
    var diff = cur - nxt;

    var text;
    if (diff <= 0) {
      text =
        'スマホプラン乗り換えシミュレーション\n' +
        '現プラン: ' + Math.round(cur).toLocaleString('ja-JP') + '円/月\n' +
        '新プラン: ' + Math.round(nxt).toLocaleString('ja-JP') + '円/月\n' +
        '→ 新プランの方が高いため元は取れません\n' +
        '#AIアプリ工房\n' +
        'https://yama-ai-factory.vercel.app/apps/smartphone-switch/';
    } else if (initialCost === 0) {
      text =
        'スマホプラン乗り換えシミュレーション\n' +
        '現プラン: ' + Math.round(cur).toLocaleString('ja-JP') + '円/月 → 新プラン: ' + Math.round(nxt).toLocaleString('ja-JP') + '円/月\n' +
        '初期費用なしで即日 ' + Math.round(diff).toLocaleString('ja-JP') + '円/月節約\n' +
        '2年間で ' + Math.round(diff * 24).toLocaleString('ja-JP') + '円お得!\n' +
        '#AIアプリ工房\n' +
        'https://yama-ai-factory.vercel.app/apps/smartphone-switch/';
    } else {
      var months = Math.ceil(initialCost / diff);
      var y2 = diff * 24 - initialCost;
      text =
        'スマホプラン乗り換えシミュレーション\n' +
        '現プラン: ' + Math.round(cur).toLocaleString('ja-JP') + '円/月 → 新プラン: ' + Math.round(nxt).toLocaleString('ja-JP') + '円/月\n' +
        '初期費用 ' + Math.round(initialCost).toLocaleString('ja-JP') + '円 → ' + months + 'ヶ月で元が取れる\n' +
        '2年間で累計 ' + (y2 >= 0 ? '+' : '') + Math.round(y2).toLocaleString('ja-JP') + '円\n' +
        '#AIアプリ工房\n' +
        'https://yama-ai-factory.vercel.app/apps/smartphone-switch/';
    }

    window.open('https://x.com/intent/tweet?text=' + encodeURIComponent(text), '_blank');
  }

  calculate();
</script>
</body>
</html>
