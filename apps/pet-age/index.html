<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ペット年齢換算機 | 犬・猫の年齢を人間年齢に換算</title>
  <meta name="description" content="愛犬・愛猫の年齢を人間の年齢に換算します。犬はサイズ(小型・中型・大型)別の補正に対応。結果をXでシェアできます。無料・登録不要。">
  <meta property="og:title" content="ペット年齢換算機 | 犬・猫の年齢を人間年齢に換算">
  <meta property="og:description" content="愛犬・愛猫の年齢が人間換算で何歳にあたるか計算します。犬はサイズ別補正付き。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://yama-ai-factory.vercel.app/apps/pet-age/">
  <meta name="twitter:card" content="summary">
  <script defer src="/_vercel/insights/script.js"></script>
  <style>
    :root {
      --bg:#07070f; --s1:#0e0e1a; --s2:#13131f; --bd:#22223a;
      --tx:#f0f0fa; --tx2:#6868a0; --tx3:#9090c0;
      --acc:#7c6ff5; --acc2:#a89cf7; --green:#34d399; --blue:#60a5fa; --red:#f87171;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background:var(--bg); color:var(--tx);
      font-family:'Segoe UI','Hiragino Sans','Yu Gothic UI',system-ui,sans-serif;
      min-height:100vh;
    }
    .wrapper { max-width:560px; margin:0 auto; padding:40px 20px 80px; }
    .back-link {
      display:inline-block; font-size:.82rem; color:var(--tx2);
      text-decoration:none; margin-bottom:28px; transition:color .15s;
    }
    .back-link:hover { color:var(--acc2); }
    .badge {
      display:inline-block; font-size:.72rem; font-weight:800; letter-spacing:.15em;
      text-transform:uppercase; color:var(--acc2);
      background:rgba(124,111,245,.15); border:1px solid rgba(124,111,245,.35);
      padding:4px 14px; border-radius:999px; margin-bottom:14px;
    }
    h1 { font-size:clamp(1.6rem,5vw,2.2rem); font-weight:900; line-height:1.3; margin-bottom:10px; }
    .grad { background:linear-gradient(135deg,#a89cf7,#60a5fa); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .hero-desc { color:var(--tx3); font-size:.9rem; line-height:1.8; margin-bottom:32px; }
    .card { background:var(--s1); border:1px solid var(--bd); border-radius:16px; padding:24px; margin-bottom:16px; }
    .section-title { font-size:.78rem; color:var(--tx2); font-weight:700; letter-spacing:.08em; text-transform:uppercase; margin-bottom:14px; }

    .seg-group { display:flex; gap:8px; }
    .seg-btn {
      flex:1; padding:10px 12px; border-radius:10px; cursor:pointer;
      font-size:.9rem; font-weight:700; border:1px solid var(--bd);
      background:var(--s2); color:var(--tx3); transition:all .15s;
      text-align:center; line-height:1.5;
    }
    .seg-btn.active { background:rgba(124,111,245,.18); border-color:var(--acc); color:var(--acc2); }
    .seg-btn:hover:not(.active) { border-color:var(--tx2); color:var(--tx); }
    .seg-sub { font-size:.7rem; font-weight:400; color:var(--tx2); display:block; margin-top:2px; }
    .seg-btn.active .seg-sub { color:var(--acc2); opacity:.7; }

    .size-section { margin-top:18px; display:none; }
    .size-section.show { display:block; }

    .age-row { display:flex; align-items:center; gap:12px; }
    .age-adj {
      width:44px; height:44px; border-radius:10px; border:1px solid var(--bd);
      background:var(--s2); color:var(--tx); font-size:1.5rem;
      cursor:pointer; display:flex; align-items:center; justify-content:center;
      flex-shrink:0; transition:border-color .15s; user-select:none;
    }
    .age-adj:hover { border-color:var(--acc); color:var(--acc2); }
    .field-input {
      flex:1; padding:10px 14px; font-size:2rem; font-weight:900;
      background:var(--s2); border:1px solid var(--bd); border-radius:10px;
      color:var(--tx); outline:none; transition:border-color .15s; text-align:center;
    }
    .field-input:focus { border-color:var(--acc); }
    .field-unit { font-size:.9rem; color:var(--tx3); font-weight:700; flex-shrink:0; }

    .result-top { text-align:center; padding:18px 0 20px; border-bottom:1px solid var(--bd); margin-bottom:18px; }
    .result-label { font-size:.84rem; color:var(--tx3); margin-bottom:10px; }
    .result-num { font-size:3.4rem; font-weight:900; color:var(--acc2); line-height:1; }
    .result-num-unit { font-size:1rem; color:var(--tx3); margin-top:6px; }
    .stage-chip {
      display:inline-block; margin-top:12px; padding:4px 16px; border-radius:999px;
      font-size:.8rem; font-weight:800; letter-spacing:.06em;
      background:rgba(124,111,245,.12); border:1px solid rgba(124,111,245,.28); color:var(--acc2);
    }
    .result-desc { font-size:.84rem; color:var(--tx3); line-height:1.75; text-align:center; margin-top:14px; }
    .result-rows { display:grid; gap:12px; }
    .result-row { display:flex; justify-content:space-between; align-items:center; gap:12px; }
    .result-name { font-size:.86rem; color:var(--tx3); }
    .result-val { font-size:.92rem; font-weight:800; white-space:nowrap; color:var(--blue); }

    .placeholder { color:var(--tx2); text-align:center; padding:8px 0; font-size:.88rem; }
    .disclaimer {
      font-size:.74rem; color:var(--tx2); line-height:1.75;
      padding:10px 12px; background:var(--s2); border-radius:8px;
      border-left:3px solid var(--bd); margin-bottom:14px;
    }
    .share-row { display:flex; gap:10px; }
    .share-btn {
      flex:1; padding:11px; border-radius:10px; cursor:pointer;
      font-size:.88rem; font-weight:700; border:none; transition:opacity .15s;
    }
    .share-x { background:#000; color:#fff; border:1px solid #2a2a2a; }
    .share-copy { background:var(--s2); color:var(--tx); border:1px solid var(--bd); }
    .share-btn:hover:not(:disabled) { opacity:.8; }
    .share-btn:disabled { opacity:.35; cursor:not-allowed; }

    @media (max-width:520px) {
      .wrapper { padding:24px 14px 60px; }
      .result-num { font-size:2.8rem; }
    }
  </style>
</head>
<body>
<div class="wrapper">
  <a class="back-link" href="/">&larr; AIアプリ工房に戻る</a>

  <div class="badge">Pet Age</div>
  <h1><span class="grad">ペット年齢</span>換算機</h1>
  <p class="hero-desc">愛犬・愛猫の年齢が人間換算で何歳にあたるか計算します。<br>犬はサイズ別の補正に対応。結果をXでシェアできます。</p>

  <div class="card">
    <div class="section-title">ペットの種類</div>
    <div class="seg-group" id="petTypeGroup">
      <button class="seg-btn active" onclick="setPetType('dog', this)">犬</button>
      <button class="seg-btn" onclick="setPetType('cat', this)">猫</button>
    </div>

    <div class="size-section show" id="sizeSection">
      <div class="section-title" style="margin-top:0; padding-top:18px;">犬のサイズ</div>
      <div class="seg-group" id="sizeGroup">
        <button class="seg-btn active" onclick="setSize('small', this)">小型犬<span class="seg-sub">10kg未満</span></button>
        <button class="seg-btn" onclick="setSize('medium', this)">中型犬<span class="seg-sub">10〜25kg</span></button>
        <button class="seg-btn" onclick="setSize('large', this)">大型犬<span class="seg-sub">25kg超</span></button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="section-title">ペットの年齢</div>
    <div class="age-row">
      <button class="age-adj" onclick="adjustAge(-1)">-</button>
      <input type="number" id="petAge" class="field-input" min="0" max="30" value="3"
        onfocus="this.select();" onkeydown="if(event.key==='Enter')calculate();" oninput="calculate()">
      <span class="field-unit">歳</span>
      <button class="age-adj" onclick="adjustAge(1)">+</button>
    </div>
  </div>

  <div class="card">
    <div id="resultContent">
      <div class="placeholder">ペットの種類と年齢を選んでください</div>
    </div>
  </div>

  <div class="card">
    <div class="disclaimer">この換算は広く知られた目安の計算式に基づくものです。個体差・品種・健康状態によって実際の老化速度は異なります。医療上の判断は必ず獣医師にご相談ください。</div>
    <div class="share-row">
      <button class="share-btn share-x" id="btn-x" onclick="doShareX()" disabled>X でシェア</button>
      <button class="share-btn share-copy" id="btn-copy" onclick="doCopy(this)" disabled>結果をコピー</button>
    </div>
  </div>
</div>

<script>
var petType = 'dog';
var dogSize = 'small';
var lastResult = null;
var LIFESPANS = { small: 15, medium: 13, large: 10, cat: 15 };

function setPetType(type, btn) {
  petType = type;
  document.querySelectorAll('#petTypeGroup .seg-btn').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
  var ss = document.getElementById('sizeSection');
  if (type === 'dog') { ss.classList.add('show'); } else { ss.classList.remove('show'); }
  calculate();
}

function setSize(size, btn) {
  dogSize = size;
  document.querySelectorAll('#sizeGroup .seg-btn').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
  calculate();
}

function adjustAge(delta) {
  var input = document.getElementById('petAge');
  var val = parseInt(input.value, 10);
  if (isNaN(val)) val = 0;
  val = Math.max(0, Math.min(30, val + delta));
  input.value = val;
  calculate();
}

function dogHumanAge(age, size) {
  if (age <= 0) return 0;
  var perYear = size === 'small' ? 4 : size === 'medium' ? 5 : 6;
  if (age < 1) return Math.round(15 * age);
  if (age < 2) return Math.round(15 + 9 * (age - 1));
  return Math.round(24 + perYear * (age - 2));
}

function catHumanAge(age) {
  if (age <= 0) return 0;
  if (age < 1) return Math.round(15 * age);
  if (age < 2) return Math.round(15 + 9 * (age - 1));
  return Math.round(24 + 4 * (age - 2));
}

var STAGES = [
  { max: 3,        label: '赤ちゃん期', desc: '急速な成長と学習の時期。心身ともに素早く発達します。' },
  { max: 13,       label: '子ども期',   desc: '好奇心旺盛でエネルギッシュ。しつけや社会化が大切な時期です。' },
  { max: 20,       label: '青年期',     desc: 'エネルギーにあふれた成長期。体はほぼ成熟しています。' },
  { max: 30,       label: '若い成人',   desc: '落ち着きが出てくる成熟した時期。活動的な壮健期です。' },
  { max: 45,       label: '壮年期',     desc: '人間でいえば働き盛りの壮年。定期的な健康管理が重要です。' },
  { max: 65,       label: '中年期',     desc: 'シニアに向けた準備の時期。食事や運動に気を配りましょう。' },
  { max: 80,       label: '高齢期',     desc: '立派なシニア。老化のサインを気にかけ、無理のない生活を。' },
  { max: Infinity, label: '超高齢期',   desc: '人間換算80歳超の超高齢期。長生きの証拠。大切にしましょう。' }
];

function getStage(humanAge) {
  for (var i = 0; i < STAGES.length; i++) {
    if (humanAge < STAGES[i].max) return STAGES[i];
  }
  return STAGES[STAGES.length - 1];
}

function calculate() {
  var raw = parseFloat(document.getElementById('petAge').value);
  if (isNaN(raw) || raw < 0) {
    document.getElementById('resultContent').innerHTML = '<div class="placeholder">年齢を入力してください</div>';
    document.getElementById('btn-x').disabled = true;
    document.getElementById('btn-copy').disabled = true;
    lastResult = null;
    return;
  }
  var age = Math.min(30, raw);
  var humanAge = petType === 'dog' ? dogHumanAge(age, dogSize) : catHumanAge(age);
  var stage = getStage(humanAge);
  var sizeLabelMap = { small: '小型犬', medium: '中型犬', large: '大型犬' };
  var petLabel = petType === 'dog' ? sizeLabelMap[dogSize] : '猫';
  var hashTag = petType === 'dog' ? '#犬のいる生活' : '#猫のいる生活';
  var lifespan = petType === 'dog' ? LIFESPANS[dogSize] : LIFESPANS.cat;
  var remaining = lifespan - age;

  lastResult = { age: age, humanAge: humanAge, stage: stage.label, stageDesc: stage.desc, petLabel: petLabel, hashTag: hashTag, lifespan: lifespan, remaining: remaining };

  var h = '';
  h += '<div class="result-top">';
  h += '<div class="result-label">' + petLabel + ' ' + age + '歳は、人間換算で</div>';
  h += '<div class="result-num">' + humanAge + '</div>';
  h += '<div class="result-num-unit">歳相当</div>';
  h += '<div class="stage-chip">' + stage.label + '</div>';
  h += '<div class="result-desc">' + stage.desc + '</div>';
  h += '</div>';
  var lifeRemStr = remaining > 0 ? '約' + Math.max(1, Math.round(remaining)) + '年' : '長寿です!';
  var lifeRemAttr = remaining > 0 ? '' : ' style="color:var(--green)"';
  h += '<div class="result-rows">';
  h += '<div class="result-row"><span class="result-name">換算前の年齢</span><span class="result-val">' + petLabel + ' ' + age + '歳</span></div>';
  h += '<div class="result-row"><span class="result-name">人間換算</span><span class="result-val">' + humanAge + '歳相当</span></div>';
  h += '<div class="result-row"><span class="result-name">ライフステージ</span><span class="result-val">' + stage.label + '</span></div>';
  h += '<div class="result-row"><span class="result-name">平均寿命まであと</span><span class="result-val"' + lifeRemAttr + '>' + lifeRemStr + '</span></div>';
  h += '</div>';

  document.getElementById('resultContent').innerHTML = h;
  document.getElementById('btn-x').disabled = false;
  document.getElementById('btn-copy').disabled = false;
}

function buildShareText() {
  var r = lastResult;
  if (!r) return '';
  var lifeStr = r.remaining > 0
    ? '平均寿命(約' + r.lifespan + '年)まであと約' + Math.max(1, Math.round(r.remaining)) + '年'
    : '平均寿命を超えた長寿です';
  return [
    '【ペット年齢換算】',
    r.petLabel + ' ' + r.age + '歳 = 人間換算 ' + r.humanAge + '歳(' + r.stage + ')',
    lifeStr,
    r.stageDesc,
    '',
    '#ペット年齢換算 ' + r.hashTag + ' #AIアプリ工房',
    'https://yama-ai-factory.vercel.app/apps/pet-age/'
  ].join('\n');
}

function doShareX() {
  if (!lastResult) return;
  window.open('https://x.com/intent/tweet?text=' + encodeURIComponent(buildShareText()), '_blank', 'noopener');
}

function doCopy(btn) {
  if (!lastResult) return;
  var text = buildShareText();
  var orig = btn.textContent;
  function done() { btn.textContent = 'コピーしました'; setTimeout(function() { btn.textContent = orig; }, 2000); }
  function fallback() {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    done();
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(fallback);
  } else { fallback(); }
}

calculate();
</script>
</body>
</html>
