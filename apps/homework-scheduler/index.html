<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>夏休み宿題終了日 逆算スケジューラー | 締め切りに間に合う?</title>
  <meta name="description" content="夏休み終了日・宿題の残り件数・1日の学習時間を入力するだけで、終了予定日・1日あたりの必要こなし量・余裕日数を即計算。夏休みの計画立てに。無料・登録不要。">

  <meta property="og:title" content="夏休み宿題終了日 逆算スケジューラー | 締め切りに間に合う?">
  <meta property="og:description" content="夏休み終了日・宿題の残り件数・1日の学習時間を入力するだけで、終了予定日・1日あたりの必要こなし量・余裕日数を即計算。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://yama-ai-factory.vercel.app/apps/homework-scheduler/">
  <meta name="twitter:card" content="summary">

  <script defer src="/_vercel/insights/script.js"></script>

  <style>
    :root {
      --bg:#07070f; --s1:#0e0e1a; --s2:#13131f; --bd:#22223a;
      --tx:#f0f0fa; --tx2:#6868a0; --tx3:#9090c0;
      --acc:#7c6ff5; --acc2:#a89cf7; --green:#34d399; --blue:#60a5fa;
      --yellow:#fbbf24; --red:#f87171;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background:var(--bg); color:var(--tx);
      font-family:'Segoe UI','Hiragino Sans','Yu Gothic UI',system-ui,sans-serif;
      min-height:100vh;
    }
    .wrapper { max-width:600px; margin:0 auto; padding:40px 20px 80px; }

    .back-link {
      display:inline-block; font-size:.82rem; color:var(--tx2);
      text-decoration:none; margin-bottom:28px; transition:color .15s;
    }
    .back-link:hover { color:var(--acc2); }

    .badge {
      display:inline-block; font-size:.72rem; font-weight:800; letter-spacing:.15em;
      text-transform:uppercase; color:var(--acc2);
      background:rgba(124,111,245,.15); border:1px solid rgba(124,111,245,.35);
      padding:4px 14px; border-radius:999px; margin-bottom:14px;
    }
    h1 { font-size:clamp(1.6rem,5vw,2.2rem); font-weight:900; line-height:1.3; margin-bottom:10px; }
    .grad { background:linear-gradient(135deg,#a89cf7,#60a5fa); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .hero-desc { color:var(--tx3); font-size:.9rem; line-height:1.8; margin-bottom:32px; }

    .card {
      background:var(--s1); border:1px solid var(--bd);
      border-radius:16px; padding:24px; margin-bottom:20px;
    }
    .field { margin-bottom:20px; }
    .field:last-child { margin-bottom:0; }
    label { display:block; font-size:.85rem; color:var(--tx3); margin-bottom:8px; font-weight:600; }
    input[type="date"], input[type="number"] {
      width:100%; padding:12px 16px; font-size:1rem; font-weight:700;
      background:var(--s2); border:1px solid var(--bd); border-radius:10px;
      color:var(--tx); outline:none; transition:border-color .15s;
    }
    input[type="date"]:focus, input[type="number"]:focus { border-color:var(--acc); }
    input[type="date"]::-webkit-calendar-picker-indicator { filter:invert(.7); cursor:pointer; }
    input[type="number"] { -moz-appearance:textfield; }
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button { -webkit-appearance:none; }

    .input-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }

    .btn {
      display:block; width:100%; padding:13px; margin-top:4px; border-radius:10px;
      background:var(--acc); border:none; color:#fff;
      font-size:1rem; font-weight:700; cursor:pointer; transition:opacity .15s;
    }
    .btn:hover { opacity:.85; }

    .results { display:none; }
    .results.show { display:block; }

    .status-banner {
      border-radius:12px; padding:16px 20px; margin-bottom:20px;
      border:1px solid transparent; text-align:center;
    }
    .status-banner.safe { background:rgba(52,211,153,.1); border-color:rgba(52,211,153,.3); }
    .status-banner.warn { background:rgba(251,191,36,.08); border-color:rgba(251,191,36,.3); }
    .status-banner.danger { background:rgba(248,113,113,.08); border-color:rgba(248,113,113,.3); }
    .status-label { font-size:.75rem; font-weight:800; letter-spacing:.1em; margin-bottom:6px; }
    .status-banner.safe .status-label { color:var(--green); }
    .status-banner.warn .status-label { color:var(--yellow); }
    .status-banner.danger .status-label { color:var(--red); }
    .status-text { font-size:1.05rem; font-weight:700; line-height:1.5; }

    .stats { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:20px; }
    .stat {
      background:var(--s1); border:1px solid var(--bd); border-radius:12px;
      padding:16px; text-align:center;
    }
    .stat .sv { font-size:1.8rem; font-weight:900; line-height:1; margin-bottom:4px; }
    .stat .sl { font-size:.78rem; color:var(--tx3); font-weight:600; }
    .stat.accent .sv { color:var(--acc2); }
    .stat.green .sv { color:var(--green); }
    .stat.yellow .sv { color:var(--yellow); }
    .stat.red .sv { color:var(--red); }

    .progress-wrap { margin-bottom:20px; }
    .progress-label { display:flex; justify-content:space-between; font-size:.8rem; color:var(--tx3); margin-bottom:8px; font-weight:600; }
    .progress-bar { height:10px; background:var(--s2); border-radius:999px; overflow:hidden; }
    .progress-fill { height:100%; border-radius:999px; transition:width .4s; }
    .fill-safe { background:linear-gradient(90deg,var(--green),#4ade80); }
    .fill-warn { background:linear-gradient(90deg,var(--yellow),#fcd34d); }
    .fill-danger { background:linear-gradient(90deg,var(--red),#fca5a5); }

    .note {
      font-size:.78rem; color:var(--tx2); line-height:1.75;
      padding:12px 14px; background:var(--s2); border-radius:8px;
      border-left:3px solid var(--bd); margin-bottom:16px;
    }

    .share-row { display:flex; gap:10px; }
    .share-btn {
      flex:1; padding:11px; border-radius:10px; cursor:pointer;
      font-size:.88rem; font-weight:700; border:none; transition:opacity .15s;
    }
    .share-x { background:#000; color:#fff; border:1px solid #2a2a2a; }
    .share-copy { background:var(--s2); color:var(--tx); border:1px solid var(--bd); }
    .share-btn:hover { opacity:.8; }

    @media (max-width:520px) {
      .wrapper { padding:24px 14px 60px; }
      .stat .sv { font-size:1.5rem; }
      .input-row { grid-template-columns:1fr; }
      .share-btn { font-size:.82rem; }
    }
  </style>
</head>
<body>
<div class="wrapper">
  <a class="back-link" href="/">&larr; AIアプリ工房に戻る</a>

  <div class="badge">Homework Scheduler</div>
  <h1><span class="grad">夏休み宿題</span><br>終了日 逆算スケジューラー</h1>
  <p class="hero-desc">宿題の残り件数と毎日の学習時間を入力するだけで、<br>終了予定日と1日あたりの必要消化量を逆算します。</p>

  <div class="card">
    <div class="field">
      <label for="endDate">夏休み終了日(提出期限)</label>
      <input type="date" id="endDate" onchange="calculate();" onkeydown="if(event.key==='Enter')calculate();">
    </div>
    <div class="field">
      <label for="totalItems">宿題の残り件数(枚・問・個など)</label>
      <input type="number" id="totalItems" value="30" min="1" max="9999" oninput="calculate();" onkeydown="if(event.key==='Enter')calculate();">
    </div>
    <div class="input-row">
      <div class="field">
        <label for="dailyHours">1日の学習可能時間(時間)</label>
        <input type="number" id="dailyHours" value="2" min="0.5" max="12" step="0.5" oninput="calculate();" onkeydown="if(event.key==='Enter')calculate();">
      </div>
      <div class="field">
        <label for="perItemMin">1件あたりの目安時間(分)</label>
        <input type="number" id="perItemMin" value="30" min="1" max="240" oninput="calculate();" onkeydown="if(event.key==='Enter')calculate();">
      </div>
    </div>
    <button class="btn" onclick="calculate()">終了予定日を計算する</button>
  </div>

  <div class="results" id="results">
    <div class="status-banner" id="statusBanner">
      <div class="status-label" id="statusLabel"></div>
      <div class="status-text" id="statusText"></div>
    </div>

    <div class="stats">
      <div class="stat accent" id="stat-finish">
        <div class="sv" id="val-finish">--</div>
        <div class="sl">終了予定日</div>
      </div>
      <div class="stat accent" id="stat-days">
        <div class="sv" id="val-days">--</div>
        <div class="sl">あと何日で終わるか</div>
      </div>
      <div class="stat accent" id="stat-daily">
        <div class="sv" id="val-daily">--</div>
        <div class="sl">1日あたりの必要消化量</div>
      </div>
      <div class="stat" id="stat-margin">
        <div class="sv" id="val-margin">--</div>
        <div class="sl">締め切りまでの余裕</div>
      </div>
    </div>

    <div class="progress-wrap">
      <div class="progress-label">
        <span>締め切り日までの消費率</span>
        <span id="prog-pct"></span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="prog-fill" style="width:0%"></div>
      </div>
    </div>

    <p class="note">計算はあくまで目安です。実際の学習ペースや宿題の難易度により異なります。計画は余裕を持って立てましょう。</p>

    <div class="share-row">
      <button class="share-btn share-x" onclick="shareX()">X でシェア</button>
      <button class="share-btn share-copy" id="copy-btn" onclick="doCopy(this)">結果をコピー</button>
    </div>
  </div>
</div>

<script>
var lastResult = null;

function getTodayStr() {
  var d = new Date();
  var y = d.getFullYear();
  var m = d.getMonth() + 1;
  var day = d.getDate();
  return y + '-' + (m < 10 ? '0' : '') + m + '-' + (day < 10 ? '0' : '') + day;
}

function addDaysToStr(dateStr, days) {
  var d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + days);
  var y = d.getFullYear();
  var m = d.getMonth() + 1;
  var day = d.getDate();
  return y + '-' + (m < 10 ? '0' : '') + m + '-' + (day < 10 ? '0' : '') + day;
}

function diffDays(aStr, bStr) {
  var a = new Date(aStr + 'T00:00:00');
  var b = new Date(bStr + 'T00:00:00');
  return Math.round((b - a) / 86400000);
}

function formatMD(dateStr) {
  var p = dateStr.split('-');
  return parseInt(p[1]) + '/' + parseInt(p[2]);
}

function formatJP(dateStr) {
  var p = dateStr.split('-');
  return p[0] + '年' + parseInt(p[1]) + '月' + parseInt(p[2]) + '日';
}

function calculate() {
  var endDateVal = document.getElementById('endDate').value;
  var totalItems = parseInt(document.getElementById('totalItems').value, 10) || 30;
  var dailyHours = parseFloat(document.getElementById('dailyHours').value) || 2;
  var perItemMin = parseInt(document.getElementById('perItemMin').value, 10) || 30;

  if (!endDateVal) return;
  if (totalItems < 1) totalItems = 1;
  if (dailyHours <= 0) dailyHours = 0.5;
  if (perItemMin < 1) perItemMin = 1;

  var today = getTodayStr();
  var daysUntilDeadline = diffDays(today, endDateVal);

  var dailyCapacity = Math.max(1, Math.floor(dailyHours * 60 / perItemMin));
  var daysNeeded = Math.ceil(totalItems / dailyCapacity);
  var finishDate = addDaysToStr(today, daysNeeded);
  var requiredDaily = daysUntilDeadline > 0 ? Math.ceil(totalItems / daysUntilDeadline) : totalItems;
  var marginDays = daysUntilDeadline - daysNeeded;
  var pctUsed = daysUntilDeadline > 0 ? Math.min(100, Math.round(daysNeeded / daysUntilDeadline * 100)) : 100;

  var statusLevel, statusLabelText, statusText;
  if (daysUntilDeadline <= 0) {
    statusLevel = 'danger';
    statusLabelText = '期限切れ';
    statusText = '夏休み終了日が過ぎています。今すぐ先生に相談しましょう！';
  } else if (marginDays >= 7) {
    statusLevel = 'safe';
    statusLabelText = '余裕あり';
    statusText = '今のペースで続ければ、締め切り' + marginDays + '日前に終わります！この調子で頑張りましょう。';
  } else if (marginDays >= 1) {
    statusLevel = 'warn';
    statusLabelText = 'ほぼ間に合う';
    statusText = '締め切り' + marginDays + '日前に終わる予定です。休息日が少ないので、少しペースを上げておくと安心です。';
  } else if (marginDays === 0) {
    statusLevel = 'warn';
    statusLabelText = 'ぎりぎり';
    statusText = '締め切り当日に終わる計算です。休息日がないので、毎日休まず続ける必要があります。';
  } else {
    statusLevel = 'danger';
    statusLabelText = '間に合わない';
    statusText = '今のペースでは締め切りに' + Math.abs(marginDays) + '日遅れます。1日の学習時間を増やすか、完了済みの宿題を確認しましょう。';
  }

  var finishColor = statusLevel === 'safe' ? 'green' : statusLevel === 'warn' ? 'yellow' : 'red';
  var marginColor = marginDays >= 7 ? 'green' : marginDays >= 1 ? 'yellow' : 'red';
  var progClass = statusLevel === 'safe' ? 'fill-safe' : statusLevel === 'warn' ? 'fill-warn' : 'fill-danger';

  document.getElementById('statusBanner').className = 'status-banner ' + statusLevel;
  document.getElementById('statusLabel').textContent = statusLabelText;
  document.getElementById('statusText').textContent = statusText;

  document.getElementById('val-finish').textContent = formatMD(finishDate);
  document.getElementById('stat-finish').className = 'stat ' + finishColor;

  document.getElementById('val-days').textContent = daysNeeded + '日';
  document.getElementById('stat-days').className = 'stat accent';

  document.getElementById('val-daily').textContent = requiredDaily + '件/日';
  document.getElementById('stat-daily').className = 'stat accent';

  document.getElementById('val-margin').textContent = (marginDays > 0 ? '+' : '') + marginDays + '日';
  document.getElementById('stat-margin').className = 'stat ' + marginColor;

  document.getElementById('prog-pct').textContent = pctUsed + '%';
  var fill = document.getElementById('prog-fill');
  fill.style.width = pctUsed + '%';
  fill.className = 'progress-fill ' + progClass;

  document.getElementById('results').classList.add('show');

  lastResult = {
    totalItems: totalItems,
    daysNeeded: daysNeeded,
    finishDate: finishDate,
    requiredDaily: requiredDaily,
    marginDays: marginDays,
    endDate: endDateVal,
    statusLabelText: statusLabelText
  };
}

function getShareText() {
  if (!lastResult) return '';
  var r = lastResult;
  return '夏休み宿題 逆算結果(' + formatJP(r.endDate) + '締め切り)\n'
    + '宿題残り: ' + r.totalItems + '件\n'
    + '終了予定: ' + formatJP(r.finishDate) + '(あと' + r.daysNeeded + '日)\n'
    + '1日の必要消化量: ' + r.requiredDaily + '件/日\n'
    + '余裕: ' + (r.marginDays > 0 ? '+' : '') + r.marginDays + '日【' + r.statusLabelText + '】\n'
    + '#夏休み宿題 #AIアプリ工房\n'
    + 'https://yama-ai-factory.vercel.app/apps/homework-scheduler/';
}

function shareX() {
  var text = getShareText();
  if (!text) return;
  window.open('https://x.com/intent/tweet?text=' + encodeURIComponent(text), '_blank', 'noopener');
}

function doCopy(btn) {
  var text = getShareText();
  if (!text) return;
  var orig = btn.textContent;
  function done() {
    btn.textContent = 'コピーしました';
    setTimeout(function() { btn.textContent = orig; }, 2000);
  }
  function fallback() {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    done();
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(fallback);
  } else {
    fallback();
  }
}

(function() {
  var d = new Date();
  var year = d.getFullYear();
  var aug31 = new Date(year, 7, 31);
  if (d > aug31) { aug31 = new Date(year + 1, 7, 31); }
  var y = aug31.getFullYear();
  var m = aug31.getMonth() + 1;
  var day = aug31.getDate();
  document.getElementById('endDate').value = y + '-' + (m < 10 ? '0' : '') + m + '-' + (day < 10 ? '0' : '') + day;
  calculate();
}());
</script>
</body>
</html>
