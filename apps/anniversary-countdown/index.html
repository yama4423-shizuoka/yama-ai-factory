<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>記念日カウントダウンメーカー | AIアプリ工房</title>
  <meta name="description" content="日付とタイトルを入れるだけで共有できるカウントダウンURLを生成。記念日・イベント・締め切りまでの残り時間をリアルタイム表示します。">
  <meta property="og:type" content="website">
  <meta property="og:title" content="記念日カウントダウンメーカー | AIアプリ工房">
  <meta property="og:description" content="日付とタイトルを入れるだけで共有できるカウントダウンURLを生成。記念日・イベント・締め切りまでの残り時間をリアルタイム表示します。">
  <meta property="og:url" content="https://yama-ai-factory.vercel.app/apps/anniversary-countdown/">
  <meta name="twitter:card" content="summary">
  <script defer src="/_vercel/insights/script.js"></script>
  <style>
    :root {
      --bg:#07070f; --s1:#0e0e1a; --s2:#13131f; --bd:#22223a;
      --tx:#f0f0fa; --tx2:#6868a0; --tx3:#9090c0;
      --acc:#7c6ff5; --acc2:#a89cf7; --green:#34d399; --blue:#60a5fa; --red:#f87171;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background:var(--bg); color:var(--tx);
      font-family:'Segoe UI','Hiragino Sans','Yu Gothic UI',system-ui,sans-serif;
      min-height:100vh;
    }
    .wrapper { max-width:600px; margin:0 auto; padding:48px 20px 80px; }
    .back { font-size:.82rem; color:var(--tx3); text-decoration:none; display:inline-block; margin-bottom:28px; transition:color .15s; }
    .back:hover { color:var(--acc2); }
    h1 { font-size:clamp(1.4rem,4vw,1.9rem); font-weight:900; margin-bottom:10px; }
    .grad { background:linear-gradient(135deg,#a89cf7,#60a5fa); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .sub { color:var(--tx3); font-size:.88rem; margin-bottom:32px; line-height:1.7; }
    .card { background:var(--s1); border:1px solid var(--bd); border-radius:16px; padding:28px 24px; }
    .field { margin-bottom:18px; }
    label { display:block; font-size:.78rem; font-weight:700; color:var(--tx3); margin-bottom:6px; letter-spacing:.05em; text-transform:uppercase; }
    label .opt { font-weight:400; opacity:.65; text-transform:none; letter-spacing:0; }
    input[type=text], input[type=date], input[type=time] {
      width:100%; background:var(--s2); border:1px solid var(--bd); border-radius:8px;
      color:var(--tx); font-size:.95rem; padding:10px 14px; outline:none;
      font-family:inherit; transition:border-color .15s;
    }
    input:focus { border-color:var(--acc); }
    input[type=date]::-webkit-calendar-picker-indicator,
    input[type=time]::-webkit-calendar-picker-indicator { filter:invert(.5); cursor:pointer; }
    .date-row { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:18px; }
    .err { font-size:.78rem; color:var(--red); display:none; margin-top:5px; }
    .btn {
      display:block; width:100%; background:var(--acc); color:#fff; border:none;
      border-radius:10px; padding:13px 20px; font-size:1rem; font-weight:800;
      cursor:pointer; font-family:inherit; transition:opacity .15s;
    }
    .btn:hover { opacity:.85; }
    .btn-sm {
      background:transparent; border:1px solid var(--bd); color:var(--tx3);
      border-radius:8px; padding:9px 16px; font-size:.85rem; font-weight:700;
      cursor:pointer; font-family:inherit; transition:border-color .15s,color .15s;
    }
    .btn-sm:hover { border-color:var(--acc2); color:var(--acc2); }
    #urlSection { display:none; margin-top:22px; padding-top:22px; border-top:1px solid var(--bd); }
    .url-label { font-size:.76rem; font-weight:700; color:var(--tx3); margin-bottom:8px; text-transform:uppercase; letter-spacing:.05em; }
    .url-box {
      background:var(--s2); border:1px solid var(--bd); border-radius:8px;
      padding:11px 13px; font-size:.78rem; color:var(--acc2); word-break:break-all;
      line-height:1.65; margin-bottom:10px;
    }
    .btn-row { display:flex; gap:10px; }
    #copyMsg { font-size:.78rem; color:var(--green); margin-top:6px; display:none; }

    /* Viewer */
    #viewerMode { display:none; }
    .v-title {
      font-size:clamp(1.5rem,5.5vw,2.4rem); font-weight:900;
      text-align:center; line-height:1.25; margin-bottom:12px;
    }
    .v-meta { text-align:center; font-size:.9rem; color:var(--tx3); margin-bottom:36px; line-height:1.6; }
    .v-meta .dstr { color:var(--acc2); font-weight:700; }
    .units { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:12px; }
    .unit {
      background:var(--s1); border:1px solid var(--bd); border-radius:14px;
      padding:20px 6px 14px; text-align:center;
    }
    .unit .num {
      font-size:clamp(1.9rem,5.5vw,2.7rem); font-weight:900; line-height:1;
      background:linear-gradient(135deg,#a89cf7,#60a5fa);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
      font-variant-numeric:tabular-nums;
    }
    .unit .lbl { font-size:.65rem; color:var(--tx2); margin-top:7px; letter-spacing:.1em; }
    #zeroMsg {
      text-align:center; font-size:1.05rem; font-weight:800; color:var(--green);
      display:none; margin-bottom:20px;
    }
    .share-row { display:flex; justify-content:center; gap:12px; flex-wrap:wrap; margin:28px 0 20px; }
    .btn-x {
      display:inline-block; background:#000; color:#fff; border:1px solid #333;
      border-radius:8px; padding:11px 24px; font-size:.92rem; font-weight:700;
      text-decoration:none; transition:background .15s;
    }
    .btn-x:hover { background:#1a1a1a; }
    .make-own { text-align:center; font-size:.85rem; }
    .make-own a { color:var(--acc2); text-decoration:none; font-weight:700; }
    .make-own a:hover { text-decoration:underline; }

    footer { margin-top:52px; padding-top:20px; border-top:1px solid var(--bd); text-align:center; font-size:.78rem; color:var(--tx2); }
    footer a { color:var(--acc2); text-decoration:none; }

    @media (max-width:520px) {
      .wrapper { padding:32px 14px 60px; }
      .date-row { grid-template-columns:1fr; }
      .units { grid-template-columns:repeat(2,1fr); gap:8px; }
      .unit { padding:16px 4px 12px; }
    }
  </style>
</head>
<body>
<div class="wrapper">
  <a class="back" href="/">← AIアプリ工房トップ</a>

  <!-- Creator mode -->
  <div id="creatorMode">
    <h1><span class="grad">記念日カウントダウン</span>メーカー</h1>
    <p class="sub">日付とタイトルを入れるだけで、共有できるカウントダウンページのURLを生成します。記念日・イベント・締め切りなど何でも使えます。</p>
    <div class="card">
      <div class="field">
        <label for="titleInput">タイトル</label>
        <input type="text" id="titleInput" placeholder="例: 結婚記念日、試験日、旅行出発" maxlength="60"
          onkeydown="if(event.key==='Enter')generateUrl();">
        <div class="err" id="titleErr">タイトルを入力してください</div>
      </div>
      <div class="date-row">
        <div>
          <label for="dateInput">日付</label>
          <input type="date" id="dateInput" onkeydown="if(event.key==='Enter')generateUrl();">
          <div class="err" id="dateErr">日付を入力してください</div>
        </div>
        <div>
          <label for="timeInput">時刻 <span class="opt">(任意)</span></label>
          <input type="time" id="timeInput" onkeydown="if(event.key==='Enter')generateUrl();">
        </div>
      </div>
      <button class="btn" onclick="generateUrl()">カウントダウンURLを生成</button>
      <div id="urlSection">
        <div class="url-label">生成されたURL</div>
        <div class="url-box" id="urlDisplay"></div>
        <div class="btn-row">
          <button class="btn-sm" onclick="copyUrl()">URLをコピー</button>
          <button class="btn-sm" onclick="openUrl()">プレビューを開く</button>
        </div>
        <div id="copyMsg">コピーしました</div>
      </div>
    </div>
  </div>

  <!-- Viewer mode (activated by URL params) -->
  <div id="viewerMode">
    <div class="v-title" id="vTitle"></div>
    <div class="v-meta">
      <span class="dstr" id="vDate"></span><span id="vDir"></span>
    </div>
    <div class="units">
      <div class="unit"><div class="num" id="uD">--</div><div class="lbl">日</div></div>
      <div class="unit"><div class="num" id="uH">--</div><div class="lbl">時間</div></div>
      <div class="unit"><div class="num" id="uM">--</div><div class="lbl">分</div></div>
      <div class="unit"><div class="num" id="uS">--</div><div class="lbl">秒</div></div>
    </div>
    <div id="zeroMsg">ちょうど今日です!</div>
    <div class="share-row">
      <a class="btn-x" id="shareBtn" href="#" target="_blank" rel="noopener">X でシェア</a>
    </div>
    <div class="make-own"><a href="/apps/anniversary-countdown/">自分のカウントダウンを作る</a></div>
  </div>

  <footer>
    <a href="/">AIアプリ工房</a> — AIが毎晩ひとつ新しいアプリを作ります
  </footer>
</div>

<script>
(function () {
  var qs = new URLSearchParams(location.search);
  var pDate = qs.get('date');
  var pTitle = qs.get('title');

  if (pDate && pTitle) {
    showViewer(pDate, pTitle);
  } else {
    showCreator();
  }

  function showCreator() {
    var d = new Date();
    d.setDate(d.getDate() + 30);
    document.getElementById('dateInput').value = d.toISOString().slice(0, 10);
  }

  function showViewer(dateStr, title) {
    document.getElementById('creatorMode').style.display = 'none';
    document.getElementById('viewerMode').style.display = 'block';

    var target = new Date(dateStr);
    if (isNaN(target.getTime())) {
      document.getElementById('vTitle').textContent = '無効な日付パラメータです';
      return;
    }

    // URLSearchParams.get() already decodes percent-encoded characters;
    // calling decodeURIComponent() again would cause URIError for titles containing '%'
    var decodedTitle = title;
    document.getElementById('vTitle').textContent = decodedTitle;
    document.title = decodedTitle + ' | 記念日カウントダウン | AIアプリ工房';

    var hasTime = /T\d{2}:\d{2}/.test(dateStr) && !dateStr.endsWith('T00:00');
    var fmtOpts = hasTime
      ? { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' }
      : { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' };
    document.getElementById('vDate').textContent = target.toLocaleString('ja-JP', fmtOpts);

    var timer = setInterval(tick, 1000);
    tick();

    function tick() {
      var now = new Date();
      var diff = target - now;
      var isPast = diff < 0;
      var abs = Math.abs(diff);
      var days = Math.floor(abs / 86400000);
      var hours = Math.floor((abs % 86400000) / 3600000);
      var mins = Math.floor((abs % 3600000) / 60000);
      var secs = Math.floor((abs % 60000) / 1000);

      document.getElementById('vDir').textContent = isPast ? ' から経過' : ' まであと';
      document.getElementById('uD').textContent = days;
      document.getElementById('uH').textContent = pad(hours);
      document.getElementById('uM').textContent = pad(mins);
      document.getElementById('uS').textContent = pad(secs);

      if (days === 0 && hours === 0 && mins === 0 && secs === 0) {
        document.getElementById('zeroMsg').style.display = 'block';
        clearInterval(timer);
      }

      var shareText = isPast
        ? decodedTitle + 'から' + days + '日経過'
        : decodedTitle + 'まであと' + days + '日';
      document.getElementById('shareBtn').href =
        'https://x.com/intent/tweet?text=' + encodeURIComponent(shareText + ' #記念日カウントダウン') +
        '&url=' + encodeURIComponent(location.href);
    }
  }

  function pad(n) { return String(n).padStart(2, '0'); }

  var _url = '';

  window.generateUrl = function () {
    var title = document.getElementById('titleInput').value.trim();
    var date = document.getElementById('dateInput').value;
    var time = document.getElementById('timeInput').value;
    var te = document.getElementById('titleErr');
    var de = document.getElementById('dateErr');

    te.style.display = title ? 'none' : 'block';
    de.style.display = date ? 'none' : 'block';
    if (!title || !date) return;

    var dateStr = time ? date + 'T' + time : date + 'T00:00';
    var base = location.origin + '/apps/anniversary-countdown/';
    _url = base + '?date=' + encodeURIComponent(dateStr) + '&title=' + encodeURIComponent(title);
    document.getElementById('urlDisplay').textContent = _url;
    document.getElementById('urlSection').style.display = 'block';
    document.getElementById('copyMsg').style.display = 'none';
  };

  window.copyUrl = function () {
    var done = function () {
      var el = document.getElementById('copyMsg');
      el.style.display = 'block';
      setTimeout(function () { el.style.display = 'none'; }, 2000);
    };
    var fallback = function () {
      var ta = document.createElement('textarea');
      ta.value = _url;
      ta.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      done();
    };
    navigator.clipboard.writeText(_url).then(done).catch(fallback);
  };

  window.openUrl = function () {
    if (_url) window.open(_url, '_blank');
  };
}());
</script>
</body>
</html>
