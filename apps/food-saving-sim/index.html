<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>食費節約シミュレーター | AIアプリ工房</title>
  <meta name="description" content="月の外食費・コンビニ費・食材費を入力し、外食を減らした場合の年間節約額と削減後の月食費目安を即計算。物価高時代の家計見直しに。無料・登録不要。">

  <meta property="og:title" content="食費節約シミュレーター | AIアプリ工房">
  <meta property="og:description" content="月の外食費・コンビニ費・食材費を入力し、外食を減らした場合の年間節約額と削減後の月食費目安を即計算。物価高時代の家計見直しに。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://yama-ai-factory.vercel.app/apps/food-saving-sim/">
  <meta name="twitter:card" content="summary">

  <script defer src="/_vercel/insights/script.js"></script>

  <style>
    :root {
      --bg:#07070f; --s1:#0e0e1a; --s2:#13131f; --bd:#22223a;
      --tx:#f0f0fa; --tx2:#6868a0; --tx3:#9090c0;
      --acc:#7c6ff5; --acc2:#a89cf7; --green:#34d399; --blue:#60a5fa;
      --yellow:#fbbf24; --red:#f87171;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background:var(--bg); color:var(--tx);
      font-family:'Segoe UI','Hiragino Sans','Yu Gothic UI',system-ui,sans-serif;
      min-height:100vh;
    }
    .wrapper { max-width:600px; margin:0 auto; padding:40px 20px 80px; }
    .back { font-size:.82rem; color:var(--tx2); text-decoration:none; display:inline-block; margin-bottom:28px; }
    .back:hover { color:var(--acc2); }
    .badge {
      display:inline-block; font-size:.72rem; font-weight:800; letter-spacing:.15em;
      text-transform:uppercase; color:var(--acc2);
      background:rgba(124,111,245,.15); border:1px solid rgba(124,111,245,.35);
      padding:4px 14px; border-radius:999px; margin-bottom:14px;
    }
    h1 { font-size:clamp(1.5rem,5vw,2.1rem); font-weight:900; line-height:1.3; margin-bottom:10px; }
    .grad { background:linear-gradient(135deg,#a89cf7,#60a5fa); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .subtitle { color:var(--tx3); font-size:.88rem; line-height:1.8; margin-bottom:28px; }

    .card { background:var(--s1); border:1px solid var(--bd); border-radius:16px; padding:24px 22px; margin-bottom:16px; }
    .card-title { font-size:.78rem; font-weight:700; color:var(--tx3); text-transform:uppercase; letter-spacing:.08em; margin-bottom:18px; }

    .field { margin-bottom:14px; }
    .field:last-child { margin-bottom:0; }
    .field label { display:block; font-size:.84rem; color:var(--tx3); font-weight:600; margin-bottom:6px; }
    .field label small { font-weight:400; font-size:.77rem; color:var(--tx2); margin-left:4px; }
    .input-row { display:flex; align-items:center; gap:10px; }
    input[type=number] {
      width:120px; padding:9px 12px; font-size:1rem; font-weight:700;
      background:var(--s2); border:1px solid var(--bd); border-radius:10px;
      color:var(--tx); outline:none; transition:border-color .15s; text-align:right;
      flex-shrink:0; -moz-appearance:textfield;
    }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { opacity:.4; }
    input[type=number]:focus { border-color:var(--acc); }
    .input-unit { font-size:.82rem; color:var(--tx2); white-space:nowrap; }
    .field-bar { height:4px; background:var(--bd); border-radius:2px; margin-top:8px; overflow:hidden; }
    .field-bar-fill { height:4px; border-radius:2px; transition:width .35s; width:0%; }

    .total-row {
      display:flex; justify-content:space-between; align-items:center;
      padding-top:14px; border-top:1px solid var(--bd); margin-top:4px;
    }
    .total-label { font-size:.85rem; font-weight:700; color:var(--tx3); }
    .total-val { font-size:1.15rem; font-weight:900; color:var(--tx); }

    .slider-label { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
    .slider-label span { font-size:.84rem; color:var(--tx3); font-weight:600; }
    .slider-highlight { color:var(--acc2); font-weight:800; font-size:.95rem; }
    input[type=range] { width:100%; accent-color:var(--acc); cursor:pointer; }

    .result-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:14px; }
    .res-card { background:var(--s2); border:1px solid var(--bd); border-radius:12px; padding:14px 16px; }
    .res-card .lbl { font-size:.73rem; color:var(--tx3); margin-bottom:4px; font-weight:600; }
    .res-card .val { font-size:1.2rem; font-weight:900; }
    .res-card .sub { font-size:.72rem; color:var(--tx2); margin-top:3px; }

    .saving-box {
      background:rgba(52,211,153,.07); border:1px solid rgba(52,211,153,.22);
      border-radius:12px; padding:18px 16px; text-align:center; margin-bottom:14px;
    }
    .saving-box .main { font-size:1.45rem; font-weight:900; color:var(--green); }
    .saving-box .sub { font-size:.8rem; color:var(--tx3); margin-top:5px; }

    .scenario-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:14px; }
    .sc-card {
      background:var(--s2); border:1px solid var(--bd); border-radius:12px;
      padding:12px 10px; text-align:center;
    }
    .sc-card.active { border-color:rgba(124,111,245,.5); background:rgba(124,111,245,.07); }
    .sc-card .sc-pct { font-size:.72rem; font-weight:700; color:var(--acc2); margin-bottom:6px; letter-spacing:.04em; }
    .sc-card .sc-save { font-size:1rem; font-weight:900; color:var(--green); }
    .sc-card .sc-lbl { font-size:.65rem; color:var(--tx2); margin-top:3px; }
    .sc-card .sc-monthly { font-size:.72rem; color:var(--tx3); margin-top:4px; font-weight:600; }

    .btn-share {
      display:block; width:100%; padding:13px; border-radius:10px;
      background:var(--acc); color:#fff; font-size:1rem; font-weight:800;
      border:none; cursor:pointer; transition:opacity .15s;
    }
    .btn-share:hover { opacity:.85; }

    @media(max-width:520px) {
      .wrapper { padding:28px 14px 60px; }
      .result-grid { grid-template-columns:1fr 1fr; gap:10px; }
      input[type=number] { width:100px; font-size:.95rem; }
      .res-card .val { font-size:1.05rem; }
      .scenario-grid { gap:8px; }
      .sc-card { padding:10px 6px; }
      .sc-card .sc-save { font-size:.9rem; }
    }
  </style>
</head>
<body>
<div class="wrapper">
  <a class="back" href="/">← AIアプリ工房トップ</a>
  <div class="badge">Food Saving Sim</div>
  <h1>食費節約<br><span class="grad">シミュレーター</span></h1>
  <p class="subtitle">月の外食費・コンビニ費・食材費を入力すると、外食を減らした場合の年間節約額と削減後の月食費目安を即計算します。物価高時代の家計見直しに。</p>

  <!-- 食費内訳 -->
  <div class="card">
    <div class="card-title">月の食費 内訳</div>

    <div class="field">
      <label>外食費<small>レストラン・定食屋・ランチ等</small></label>
      <div class="input-row">
        <input type="number" id="eating_out" value="30000" min="0" step="1000"
          onfocus="this.select()" onkeydown="if(event.key==='Enter')calculate();" oninput="calculate()">
        <span class="input-unit">円</span>
      </div>
      <div class="field-bar"><div class="field-bar-fill" id="bar_out" style="background:var(--acc);"></div></div>
    </div>

    <div class="field">
      <label>コンビニ費<small>コンビニ食・テイクアウト・デリバリー</small></label>
      <div class="input-row">
        <input type="number" id="convenience" value="10000" min="0" step="1000"
          onfocus="this.select()" onkeydown="if(event.key==='Enter')calculate();" oninput="calculate()">
        <span class="input-unit">円</span>
      </div>
      <div class="field-bar"><div class="field-bar-fill" id="bar_conv" style="background:var(--blue);"></div></div>
    </div>

    <div class="field">
      <label>食材費<small>スーパー・八百屋・米・調味料等</small></label>
      <div class="input-row">
        <input type="number" id="groceries" value="30000" min="0" step="1000"
          onfocus="this.select()" onkeydown="if(event.key==='Enter')calculate();" oninput="calculate()">
        <span class="input-unit">円</span>
      </div>
      <div class="field-bar"><div class="field-bar-fill" id="bar_groc" style="background:var(--green);"></div></div>
    </div>

    <div class="total-row">
      <span class="total-label">月の食費合計</span>
      <span class="total-val" id="totalMonthly">-</span>
    </div>
  </div>

  <!-- 削減シミュレーション -->
  <div class="card">
    <div class="card-title">削減シミュレーション</div>
    <div class="field">
      <div class="slider-label">
        <span>外食費・コンビニ費を</span>
        <span class="slider-highlight" id="redPctDisplay">20%</span>
        <span>削減した場合</span>
      </div>
      <input type="range" id="redSlider" min="10" max="50" value="20" step="10" oninput="calculate()">
      <div style="display:flex;justify-content:space-between;font-size:.7rem;color:var(--tx2);margin-top:4px;">
        <span>10%</span><span>20%</span><span>30%</span><span>40%</span><span>50%</span>
      </div>
    </div>
  </div>

  <!-- 計算結果 -->
  <div class="card">
    <div class="card-title">計算結果</div>
    <div class="result-grid">
      <div class="res-card">
        <div class="lbl">現在の月食費</div>
        <div class="val" id="rCurrentMonth">-</div>
      </div>
      <div class="res-card">
        <div class="lbl">削減後の月食費</div>
        <div class="val" style="color:var(--blue);" id="rNewMonth">-</div>
      </div>
      <div class="res-card">
        <div class="lbl">月の節約額</div>
        <div class="val" style="color:var(--green);" id="rMonthlySave">-</div>
      </div>
      <div class="res-card">
        <div class="lbl">現在の年間食費</div>
        <div class="val" id="rAnnualCurrent">-</div>
      </div>
    </div>

    <div class="saving-box">
      <div class="main" id="rAnnualSave">-</div>
      <div class="sub" id="rSaveSub">外食費・コンビニ費を削減した場合の年間節約額</div>
    </div>

    <div style="font-size:.78rem;color:var(--tx3);font-weight:700;margin-bottom:10px;">削減シナリオ比較</div>
    <div class="scenario-grid" id="scenarioGrid"></div>

    <button class="btn-share" onclick="shareX()">X(Twitter)でシェアする</button>
  </div>
</div>

<script>
function v(id) { return Math.max(0, parseFloat(document.getElementById(id).value) || 0); }

function fmtYen(n) {
  if (n >= 10000) return (Math.round(n / 1000) / 10).toLocaleString() + '万円';
  return n.toLocaleString() + '円';
}

function fmtFull(n) { return n.toLocaleString() + '円'; }

function calculate() {
  var out  = v('eating_out');
  var conv = v('convenience');
  var groc = v('groceries');
  var total = out + conv + groc;
  var variable = out + conv; // 削減対象

  // bar widths
  if (total > 0) {
    document.getElementById('bar_out').style.width  = (out  / total * 100).toFixed(1) + '%';
    document.getElementById('bar_conv').style.width = (conv / total * 100).toFixed(1) + '%';
    document.getElementById('bar_groc').style.width = (groc / total * 100).toFixed(1) + '%';
  } else {
    ['bar_out','bar_conv','bar_groc'].forEach(function(id){ document.getElementById(id).style.width = '0%'; });
  }

  document.getElementById('totalMonthly').textContent = fmtFull(total);

  var pct = parseInt(document.getElementById('redSlider').value) || 20;
  document.getElementById('redPctDisplay').textContent = pct + '%';

  var monthlySave   = Math.round(variable * pct / 100);
  var newMonth      = total - monthlySave;
  var annualCurrent = total * 12;
  var annualSave    = monthlySave * 12;

  document.getElementById('rCurrentMonth').textContent = fmtFull(total);
  document.getElementById('rNewMonth').textContent     = fmtFull(newMonth);
  document.getElementById('rMonthlySave').textContent  = '+' + fmtFull(monthlySave);
  document.getElementById('rAnnualCurrent').textContent = fmtYen(annualCurrent);
  document.getElementById('rAnnualSave').textContent   = '年間 ' + fmtYen(annualSave) + ' 節約できます';
  document.getElementById('rSaveSub').textContent =
    '外食費・コンビニ費を' + pct + '%削減: 月' + fmtFull(monthlySave) + ' / 年' + fmtYen(annualSave) + 'の節約';

  // scenario comparison cards
  var grid = document.getElementById('scenarioGrid');
  grid.innerHTML = '';
  [10, 20, 30].forEach(function(sp) {
    var ms = Math.round(variable * sp / 100);
    var as = ms * 12;
    var nm = total - ms;
    var card = document.createElement('div');
    card.className = 'sc-card' + (sp === pct ? ' active' : '');
    card.innerHTML =
      '<div class="sc-pct">' + sp + '% 削減</div>' +
      '<div class="sc-save">年' + fmtYen(as) + '</div>' +
      '<div class="sc-lbl">節約</div>' +
      '<div class="sc-monthly">月食費 ' + fmtFull(nm) + '</div>';
    grid.appendChild(card);
  });
}

function shareX() {
  var out  = v('eating_out');
  var conv = v('convenience');
  var groc = v('groceries');
  var total = out + conv + groc;
  var variable = out + conv;
  var pct = parseInt(document.getElementById('redSlider').value) || 20;
  var monthlySave = Math.round(variable * pct / 100);
  var annualSave  = monthlySave * 12;
  var newMonth    = total - monthlySave;

  var text =
    '食費節約シミュレーターで試算しました。\n' +
    '月の食費: ' + total.toLocaleString() + '円 (外食+コンビニ: ' + variable.toLocaleString() + '円)\n' +
    '外食費を' + pct + '%削減すると月食費は' + newMonth.toLocaleString() + '円になり、年間' + annualSave.toLocaleString() + '円の節約！\n' +
    '#AIアプリ工房\nhttps://yama-ai-factory.vercel.app/apps/food-saving-sim/';
  window.open('https://x.com/intent/tweet?text=' + encodeURIComponent(text), '_blank');
}

calculate();
</script>
</body>
</html>
