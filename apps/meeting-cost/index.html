<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>会議コストメーター | 会議の人件費をリアルタイム計算</title>
  <meta name="description" content="参加人数と平均時給を入力してスタートすると、会議の人件費がリアルタイムで増えていきます。終了時に合計をシェアできます。無料・登録不要。">

  <meta property="og:title" content="会議コストメーター | 会議の人件費をリアルタイム計算">
  <meta property="og:description" content="参加人数と平均時給を入力するだけで、会議コストがリアルタイムで増えていく。チームの生産性を意識するためのツール。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://yama-ai-factory.vercel.app/apps/meeting-cost/">
  <meta name="twitter:card" content="summary">

  <script defer src="/_vercel/insights/script.js"></script>

  <style>
    :root {
      --bg:#07070f; --s1:#0e0e1a; --s2:#13131f; --bd:#22223a;
      --tx:#f0f0fa; --tx2:#6868a0; --tx3:#9090c0;
      --acc:#7c6ff5; --acc2:#a89cf7; --green:#34d399; --blue:#60a5fa;
      --red:#f87171;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background:var(--bg); color:var(--tx);
      font-family:'Segoe UI','Hiragino Sans','Yu Gothic UI',system-ui,sans-serif;
      min-height:100vh;
    }
    .wrapper { max-width:600px; margin:0 auto; padding:40px 20px 80px; }

    .back-link {
      display:inline-block; font-size:.82rem; color:var(--tx2);
      text-decoration:none; margin-bottom:28px; transition:color .15s;
    }
    .back-link:hover { color:var(--acc2); }

    .badge {
      display:inline-block; font-size:.72rem; font-weight:800; letter-spacing:.15em;
      text-transform:uppercase; color:var(--acc2);
      background:rgba(124,111,245,.15); border:1px solid rgba(124,111,245,.35);
      padding:4px 14px; border-radius:999px; margin-bottom:14px;
    }
    h1 { font-size:clamp(1.6rem,5vw,2.2rem); font-weight:900; line-height:1.3; margin-bottom:10px; }
    .grad { background:linear-gradient(135deg,#a89cf7,#60a5fa); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .hero-desc { color:var(--tx3); font-size:.9rem; line-height:1.8; margin-bottom:32px; }

    .card {
      background:var(--s1); border:1px solid var(--bd);
      border-radius:16px; padding:24px; margin-bottom:20px;
    }

    .form-row { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:18px; }
    .form-group label { display:block; font-size:.85rem; color:var(--tx3); margin-bottom:8px; font-weight:600; }
    .form-group input {
      width:100%; padding:11px 14px; font-size:1.1rem; font-weight:700;
      background:var(--s2); border:1px solid var(--bd); border-radius:10px;
      color:var(--tx); outline:none; transition:border-color .15s;
    }
    .form-group input:focus { border-color:var(--acc); }
    .input-hint { font-size:.75rem; color:var(--tx2); margin-top:5px; }

    .preset-label { font-size:.82rem; color:var(--tx2); margin-bottom:8px; }
    .presets { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px; }
    .preset-btn {
      padding:5px 12px; border-radius:8px; font-size:.78rem; font-weight:600;
      background:var(--s2); border:1px solid var(--bd); color:var(--tx3);
      cursor:pointer; transition:all .15s;
    }
    .preset-btn:hover { border-color:var(--acc); color:var(--acc2); }

    .cost-display { text-align:center; padding:24px 20px 16px; }
    .cost-label { font-size:.82rem; color:var(--tx2); font-weight:600; margin-bottom:10px; }
    .cost-value {
      font-size:clamp(2.8rem,10vw,4.4rem); font-weight:900; line-height:1.1;
      font-variant-numeric:tabular-nums;
      background:linear-gradient(135deg,#a89cf7,#60a5fa);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    }
    .cost-value.running {
      background:linear-gradient(135deg,#f87171,#fb923c);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    }
    .cost-sub { font-size:.85rem; color:var(--tx3); margin-top:10px; }
    .cost-rate { font-size:.8rem; color:var(--tx2); margin-top:4px; }

    .elapsed-row { display:flex; justify-content:center; margin-bottom:22px; }
    .elapsed-time {
      font-size:2rem; font-weight:900; font-variant-numeric:tabular-nums;
      color:var(--tx2); letter-spacing:.06em;
    }
    .elapsed-time.running { color:var(--tx); }

    .btn-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .btn {
      padding:13px; border-radius:10px; border:none;
      font-size:1rem; font-weight:700; cursor:pointer; transition:opacity .15s;
    }
    .btn-start { background:var(--acc); color:#fff; }
    .btn-stop { background:var(--red); color:#fff; }
    .btn-reset { background:var(--s2); color:var(--tx); border:1px solid var(--bd); }
    .btn:disabled { opacity:.35; cursor:not-allowed; }
    .btn:not(:disabled):hover { opacity:.85; }
    .btn-full { grid-column:1/-1; }

    .result-card { display:none; }
    .result-card.show { display:block; }
    .result-heading { font-size:.9rem; font-weight:700; color:var(--green); margin-bottom:14px; }

    .result-summary {
      background:rgba(52,211,153,.05); border:1px solid rgba(52,211,153,.18);
      border-radius:12px; padding:6px 16px; margin-bottom:16px;
    }
    .r-row {
      display:flex; justify-content:space-between; align-items:center;
      padding:10px 0; border-bottom:1px solid rgba(255,255,255,.05);
    }
    .r-row:last-child { border-bottom:none; }
    .r-label { font-size:.85rem; color:var(--tx3); }
    .r-value { font-size:.95rem; font-weight:800; }
    .r-value.total { font-size:1.4rem; color:var(--acc2); }

    .share-row { display:flex; gap:10px; }
    .share-btn {
      flex:1; padding:11px; border-radius:10px; cursor:pointer;
      font-size:.88rem; font-weight:700; border:none; transition:opacity .15s;
    }
    .share-x { background:#000; color:#fff; border:1px solid #2a2a2a; }
    .share-copy { background:var(--s2); color:var(--tx); border:1px solid var(--bd); }
    .share-btn:hover { opacity:.8; }

    .note {
      font-size:.75rem; color:var(--tx2); line-height:1.75; margin-top:20px;
    }

    @media (max-width:520px) {
      .wrapper { padding:24px 14px 60px; }
      .form-row { grid-template-columns:1fr; }
      .cost-value { font-size:2.8rem; }
      .elapsed-time { font-size:1.6rem; }
      .preset-btn { font-size:.74rem; }
    }
  </style>
</head>
<body>
<div class="wrapper">
  <a class="back-link" href="/">&larr; AIアプリ工房に戻る</a>

  <div class="badge">Meeting Cost</div>
  <h1><span class="grad">会議コスト</span>メーター</h1>
  <p class="hero-desc">参加人数と平均時給を入力してスタートすると、会議の人件費がリアルタイムで増えていきます。終了後に合計をシェアできます。</p>

  <div class="card" id="setupCard">
    <div class="form-row">
      <div class="form-group">
        <label for="participants">参加人数</label>
        <input type="number" id="participants" value="5" min="1" max="100" step="1">
        <div class="input-hint">1 〜 100人</div>
      </div>
      <div class="form-group">
        <label for="hourlyWage">平均時給(円)</label>
        <input type="number" id="hourlyWage" value="3000" min="1" step="100">
        <div class="input-hint">円 / 時間</div>
      </div>
    </div>
    <div class="preset-label">時給の目安プリセット</div>
    <div class="presets">
      <button class="preset-btn" onclick="setWage(1500)">アルバイト 1,500円</button>
      <button class="preset-btn" onclick="setWage(2000)">一般社員 2,000円</button>
      <button class="preset-btn" onclick="setWage(3000)">中堅社員 3,000円</button>
      <button class="preset-btn" onclick="setWage(5000)">管理職 5,000円</button>
    </div>
    <button class="btn btn-start btn-full" onclick="startMeter()">会議スタート</button>
  </div>

  <div class="card" id="meterCard" style="display:none;">
    <div class="cost-display">
      <div class="cost-label">累積コスト</div>
      <div class="cost-value" id="costValue">&yen;0</div>
      <div class="cost-sub" id="costSub"></div>
      <div class="cost-rate" id="costRate"></div>
    </div>
    <div class="elapsed-row">
      <div class="elapsed-time" id="elapsedTime">00:00:00</div>
    </div>
    <div class="btn-row">
      <button class="btn btn-stop" onclick="stopMeter()">会議終了</button>
      <button class="btn btn-reset" onclick="resetMeter()">リセット</button>
    </div>
  </div>

  <div class="card result-card" id="resultCard">
    <div class="result-heading">会議終了 — コスト集計</div>
    <div class="result-summary" id="resultSummary"></div>
    <div class="share-row">
      <button class="share-btn share-x" onclick="shareX()">X でシェア</button>
      <button class="share-btn share-copy" id="copyBtn" onclick="doCopy()">結果をコピー</button>
    </div>
    <button class="btn btn-reset" style="width:100%; margin-top:12px;" onclick="resetMeter()">もう一度計測する</button>
  </div>

  <p class="note">参加者の平均時給を入力してください。表示されるコストは目安であり、実際の人件費とは異なります。</p>
</div>

<script>
var timerInterval = null;
var startEpoch = 0;
var elapsed = 0;
var running = false;
var savedParticipants = 1;
var savedWage = 1;
var savedRate = 0;
var finalCost = 0;
var finalElapsed = 0;

function setWage(v) {
  document.getElementById('hourlyWage').value = v;
}

function formatYen(n) {
  return '¥' + Math.floor(n).toLocaleString('ja-JP');
}

function formatElapsed(secs) {
  var h = Math.floor(secs / 3600);
  var m = Math.floor((secs % 3600) / 60);
  var s = secs % 60;
  return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
}

function formatDuration(secs) {
  var h = Math.floor(secs / 3600);
  var m = Math.floor((secs % 3600) / 60);
  var s = secs % 60;
  var parts = [];
  if (h > 0) parts.push(h + '時間');
  if (m > 0) parts.push(m + '分');
  if (s > 0 || parts.length === 0) parts.push(s + '秒');
  return parts.join('');
}

function startMeter() {
  var p = parseInt(document.getElementById('participants').value, 10);
  var w = parseInt(document.getElementById('hourlyWage').value, 10);
  if (!p || p < 1 || !w || w < 1) return;

  savedParticipants = p;
  savedWage = w;
  savedRate = (p * w) / 3600;

  elapsed = 0;
  startEpoch = Date.now();
  running = true;

  document.getElementById('setupCard').style.display = 'none';
  document.getElementById('meterCard').style.display = 'block';
  document.getElementById('resultCard').classList.remove('show');

  document.getElementById('costRate').textContent =
    p + '人 x 時給' + w.toLocaleString('ja-JP') + '円 = ' + (p * w).toLocaleString('ja-JP') + '円/時間';

  timerInterval = setInterval(tick, 200);
}

function tick() {
  elapsed = Math.floor((Date.now() - startEpoch) / 1000);
  var cost = elapsed * savedRate;
  var cv = document.getElementById('costValue');
  cv.textContent = formatYen(cost);
  cv.className = 'cost-value running';
  var et = document.getElementById('elapsedTime');
  et.textContent = formatElapsed(elapsed);
  et.className = 'elapsed-time running';
  document.getElementById('costSub').textContent = formatDuration(elapsed) + ' 経過';
}

function stopMeter() {
  if (!running) return;
  clearInterval(timerInterval);
  running = false;
  elapsed = Math.floor((Date.now() - startEpoch) / 1000);
  finalCost = elapsed * savedRate;
  finalElapsed = elapsed;

  document.getElementById('meterCard').style.display = 'none';
  var rc = document.getElementById('resultCard');
  rc.classList.add('show');

  document.getElementById('resultSummary').innerHTML =
    '<div class="r-row"><span class="r-label">会議時間</span><span class="r-value">' + formatDuration(finalElapsed) + '</span></div>' +
    '<div class="r-row"><span class="r-label">参加人数</span><span class="r-value">' + savedParticipants + '人</span></div>' +
    '<div class="r-row"><span class="r-label">平均時給</span><span class="r-value">' + savedWage.toLocaleString('ja-JP') + '円</span></div>' +
    '<div class="r-row"><span class="r-label">合計コスト</span><span class="r-value total">' + formatYen(finalCost) + '</span></div>';
}

function resetMeter() {
  clearInterval(timerInterval);
  running = false;
  elapsed = 0;
  document.getElementById('meterCard').style.display = 'none';
  document.getElementById('resultCard').classList.remove('show');
  document.getElementById('setupCard').style.display = 'block';
  document.getElementById('costValue').className = 'cost-value';
  document.getElementById('costValue').textContent = '¥' + '0';
  document.getElementById('elapsedTime').className = 'elapsed-time';
  document.getElementById('elapsedTime').textContent = '00:00:00';
  document.getElementById('costSub').textContent = '';
}

function getShareText() {
  return '会議コスト: ' + formatYen(finalCost) + '\n' +
    savedParticipants + '人 x 時給' + savedWage.toLocaleString('ja-JP') + '円 x ' + formatDuration(finalElapsed) + '\n' +
    '#会議コストメーター\nhttps://yama-ai-factory.vercel.app/apps/meeting-cost/';
}

function shareX() {
  window.open('https://x.com/intent/tweet?text=' + encodeURIComponent(getShareText()), '_blank', 'noopener');
}

function doCopy() {
  var text = getShareText();
  var btn = document.getElementById('copyBtn');
  var orig = btn.textContent;
  function done() {
    btn.textContent = 'コピーしました';
    setTimeout(function() { btn.textContent = orig; }, 2000);
  }
  function fallback() {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.cssText = 'position:fixed;opacity:0;';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    done();
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(fallback);
  } else {
    fallback();
  }
}
</script>
</body>
</html>
