<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>睡眠負債チェッカー | 年間の睡眠不足を可視化</title>
  <meta name="description" content="平日・休日の睡眠時間を入力するだけで、週・月・年単位の睡眠負債を計算します。「年間○時間分の睡眠不足」という気づきをXでシェア。無料・登録不要。">

  <meta property="og:title" content="睡眠負債チェッカー | 年間の睡眠不足を可視化">
  <meta property="og:description" content="平日・休日の睡眠時間を入力するだけで、週・月・年単位の睡眠負債を計算します。「年間○時間分の睡眠不足」が分かる無料ツール。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://yama-ai-factory.vercel.app/apps/sleep-debt/">
  <meta name="twitter:card" content="summary">

  <script defer src="/_vercel/insights/script.js"></script>

  <style>
    :root {
      --bg:#07070f; --s1:#0e0e1a; --s2:#13131f; --bd:#22223a;
      --tx:#f0f0fa; --tx2:#6868a0; --tx3:#9090c0;
      --acc:#7c6ff5; --acc2:#a89cf7; --green:#34d399; --blue:#60a5fa;
      --yellow:#fbbf24; --red:#f87171;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background:var(--bg); color:var(--tx);
      font-family:'Segoe UI','Hiragino Sans','Yu Gothic UI',system-ui,sans-serif;
      min-height:100vh;
    }
    .wrapper { max-width:560px; margin:0 auto; padding:40px 20px 80px; }
    .back { font-size:.82rem; color:var(--tx2); text-decoration:none; display:inline-block; margin-bottom:28px; }
    .back:hover { color:var(--acc2); }
    h1 { font-size:clamp(1.4rem,4vw,1.9rem); font-weight:900; margin-bottom:8px; }
    .subtitle { color:var(--tx3); font-size:.9rem; line-height:1.7; margin-bottom:32px; }
    .card {
      background:var(--s1); border:1px solid var(--bd); border-radius:16px;
      padding:24px 22px; margin-bottom:16px;
    }
    .card-title {
      font-size:.82rem; font-weight:700; color:var(--tx3);
      text-transform:uppercase; letter-spacing:.08em; margin-bottom:18px;
    }
    .field { margin-bottom:16px; }
    .field label { display:block; font-size:.85rem; color:var(--tx3); margin-bottom:6px; }
    .field .hint { font-size:.75rem; color:var(--tx2); margin-top:4px; }
    .field input[type=number] {
      width:100%; background:var(--s2); border:1px solid var(--bd); border-radius:8px;
      padding:10px 14px; color:var(--tx); font-size:1rem;
      outline:none; transition:border-color .15s; -moz-appearance:textfield;
    }
    .field input[type=number]::-webkit-inner-spin-button,
    .field input[type=number]::-webkit-outer-spin-button { opacity:.5; }
    .field input[type=number]:focus { border-color:var(--acc); }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .calc-btn {
      width:100%; background:var(--acc); color:#fff; border:none; border-radius:10px;
      padding:13px; font-size:1rem; font-weight:700; cursor:pointer;
      transition:opacity .15s; margin-top:4px;
    }
    .calc-btn:hover { opacity:.85; }

    .result { display:none; }
    .result.show { display:block; }

    .level-banner {
      border-radius:12px; padding:14px 18px; margin-bottom:16px;
      display:flex; align-items:center; gap:12px;
    }
    .level-ok    { background:rgba(52,211,153,.1);  border:1px solid rgba(52,211,153,.3); }
    .level-mild  { background:rgba(251,191,36,.1);  border:1px solid rgba(251,191,36,.3); }
    .level-serious { background:rgba(248,113,113,.1); border:1px solid rgba(248,113,113,.3); }
    .level-label {
      font-size:.78rem; font-weight:800; letter-spacing:.1em;
      text-transform:uppercase; white-space:nowrap;
    }
    .level-ok    .level-label { color:var(--green); }
    .level-mild  .level-label { color:var(--yellow); }
    .level-serious .level-label { color:var(--red); }
    .level-note { font-size:.85rem; color:var(--tx3); line-height:1.6; }

    .metrics { display:grid; gap:10px; margin-bottom:16px; }
    .metric {
      background:var(--s2); border-radius:10px; padding:14px 18px;
      display:flex; justify-content:space-between; align-items:baseline;
    }
    .metric .m-label { font-size:.85rem; color:var(--tx3); }
    .metric .m-value { font-size:1.25rem; font-weight:800; }
    .metric .m-value .unit { font-size:.78rem; font-weight:400; color:var(--tx3); margin-left:3px; }
    .debt-color { color:var(--red); }
    .ok-color   { color:var(--green); }

    .bar-area { margin-bottom:16px; }
    .bar-label { font-size:.78rem; color:var(--tx3); margin-bottom:6px; }
    .bar-track {
      background:var(--s2); border-radius:999px; height:8px; overflow:hidden;
    }
    .bar-fill {
      height:100%; border-radius:999px; transition:width .5s ease;
    }
    .bar-fill.debt   { background:linear-gradient(90deg,#f87171,#fbbf24); }
    .bar-fill.no-debt { background:var(--green); }

    .share-btn {
      width:100%; background:var(--s2); border:1px solid var(--bd); border-radius:10px;
      padding:12px; font-size:.9rem; font-weight:700; cursor:pointer;
      color:var(--tx); transition:border-color .15s, color .15s;
    }
    .share-btn:hover { border-color:var(--acc2); color:var(--acc2); }

    .disclaimer {
      font-size:.75rem; color:var(--tx2); margin-top:16px; line-height:1.7;
      padding:12px 16px; background:var(--s2); border-radius:8px;
    }
    @media (max-width:520px) {
      .wrapper { padding:28px 14px 60px; }
      .row { grid-template-columns:1fr; }
    }
  </style>
</head>
<body>
<div class="wrapper">
  <a href="/" class="back">← AIアプリ工房に戻る</a>
  <h1>睡眠負債チェッカー</h1>
  <p class="subtitle">平日・休日の睡眠時間を入力するだけで、週・月・年単位で蓄積される睡眠負債を計算します。</p>

  <div class="card">
    <div class="card-title">睡眠時間を入力</div>
    <div class="field">
      <label for="target">目標睡眠時間（成人推奨: 7〜8時間）</label>
      <input type="number" id="target" value="7" min="4" max="12" step="0.5"
        onkeydown="if(event.key==='Enter')calculate();">
      <div class="hint">自分が理想とする1日の睡眠時間を入力してください</div>
    </div>
    <div class="row">
      <div class="field">
        <label for="weekday">平日の平均睡眠時間</label>
        <input type="number" id="weekday" value="6" min="0" max="16" step="0.5"
          onkeydown="if(event.key==='Enter')calculate();">
      </div>
      <div class="field">
        <label for="weekend">休日の平均睡眠時間</label>
        <input type="number" id="weekend" value="8" min="0" max="16" step="0.5"
          onkeydown="if(event.key==='Enter')calculate();">
      </div>
    </div>
    <div class="field">
      <label for="weekdays">1週間の平日数</label>
      <input type="number" id="weekdays" value="5" min="1" max="6" step="1"
        onkeydown="if(event.key==='Enter')calculate();">
    </div>
    <button class="calc-btn" onclick="calculate()">睡眠負債を計算する</button>
  </div>

  <div class="result" id="result">
    <div class="level-banner" id="levelBanner">
      <div class="level-label" id="levelLabel"></div>
      <div class="level-note" id="levelNote"></div>
    </div>

    <div class="card">
      <div class="card-title">睡眠負債の内訳</div>
      <div class="metrics">
        <div class="metric">
          <span class="m-label">1週間の睡眠負債</span>
          <span class="m-value" id="weeklyDebt">-<span class="unit">時間</span></span>
        </div>
        <div class="metric">
          <span class="m-label">1ヶ月の睡眠負債</span>
          <span class="m-value" id="monthlyDebt">-<span class="unit">時間</span></span>
        </div>
        <div class="metric">
          <span class="m-label">年間の睡眠負債</span>
          <span class="m-value" id="annualDebt">-<span class="unit">時間</span></span>
        </div>
        <div class="metric">
          <span class="m-label">年間睡眠負債(日換算)</span>
          <span class="m-value" id="annualDays">-<span class="unit">日分</span></span>
        </div>
      </div>

      <div class="bar-area">
        <div class="bar-label" id="barLabel"></div>
        <div class="bar-track">
          <div class="bar-fill" id="barFill" style="width:0%"></div>
        </div>
      </div>

      <button class="share-btn" onclick="shareX()">Xでシェアする</button>
    </div>

    <div class="disclaimer">
      ※ この計算は目安です。睡眠の質・個人差・健康状態により実際の影響は異なります。体調に関するご不安は医療機関にご相談ください。
    </div>
  </div>
</div>

<script>
  var lastResult = null;

  function fmt(h) {
    return Math.abs(h).toFixed(1);
  }

  function calculate() {
    var target    = parseFloat(document.getElementById('target').value)   || 7;
    var weekday   = parseFloat(document.getElementById('weekday').value)   || 0;
    var weekend   = parseFloat(document.getElementById('weekend').value)   || 0;
    var wdCount   = parseInt(document.getElementById('weekdays').value)    || 5;
    var weCount   = 7 - wdCount;

    var weeklyDebt  = (target - weekday) * wdCount + (target - weekend) * weCount;
    var monthlyDebt = weeklyDebt * (52 / 12);
    var annualDebt  = weeklyDebt * 52;
    var annualDays  = annualDebt / target;

    lastResult = { weeklyDebt: weeklyDebt, monthlyDebt: monthlyDebt, annualDebt: annualDebt, annualDays: annualDays, weekday: weekday, weekend: weekend, target: target };

    document.getElementById('result').classList.add('show');

    var isDebt = weeklyDebt > 0;
    var colorClass = isDebt ? 'debt-color' : 'ok-color';

    document.getElementById('weeklyDebt').innerHTML  = fmt(weeklyDebt)  + '<span class="unit">時間</span>';
    document.getElementById('weeklyDebt').className  = 'm-value ' + colorClass;
    document.getElementById('monthlyDebt').innerHTML = fmt(monthlyDebt) + '<span class="unit">時間</span>';
    document.getElementById('monthlyDebt').className = 'm-value ' + colorClass;
    document.getElementById('annualDebt').innerHTML  = fmt(annualDebt)  + '<span class="unit">時間</span>';
    document.getElementById('annualDebt').className  = 'm-value ' + colorClass;
    document.getElementById('annualDays').innerHTML  = Math.abs(annualDays).toFixed(1) + '<span class="unit">' + (isDebt ? '日分不足' : '日分余裕') + '</span>';
    document.getElementById('annualDays').className  = 'm-value ' + colorClass;

    var banner = document.getElementById('levelBanner');
    var label  = document.getElementById('levelLabel');
    var note   = document.getElementById('levelNote');
    var barFill = document.getElementById('barFill');
    var barLabel = document.getElementById('barLabel');

    banner.className = 'level-banner';

    if (!isDebt) {
      banner.classList.add('level-ok');
      label.textContent = '睡眠充足';
      note.textContent  = '目標睡眠時間を達成できています。この調子で良質な睡眠を維持しましょう。';
      barFill.className = 'bar-fill no-debt';
      barFill.style.width = '100%';
      barLabel.textContent = '睡眠充足状態';
    } else if (weeklyDebt < 2) {
      banner.classList.add('level-mild');
      label.textContent = '軽度の睡眠不足';
      note.textContent  = '週' + weeklyDebt.toFixed(1) + '時間ペースで睡眠負債が積み重なっています。年間' + Math.round(annualDebt) + '時間分の睡眠不足です。';
      barFill.className = 'bar-fill debt';
      barFill.style.width = Math.min(weeklyDebt / 7 * 100, 100) + '%';
      barLabel.textContent = '睡眠負債の進行度(週7時間を100%とした目安)';
    } else if (weeklyDebt < 5) {
      banner.classList.add('level-mild');
      label.textContent = '中程度の睡眠不足';
      note.textContent  = '週' + weeklyDebt.toFixed(1) + '時間ペースで睡眠負債が積み重なっています。年間で' + Math.round(annualDebt) + '時間、約' + annualDays.toFixed(1) + '日分の睡眠不足になります。';
      barFill.className = 'bar-fill debt';
      barFill.style.width = Math.min(weeklyDebt / 7 * 100, 100) + '%';
      barLabel.textContent = '睡眠負債の進行度(週7時間を100%とした目安)';
    } else {
      banner.classList.add('level-serious');
      label.textContent = '深刻な睡眠不足';
      note.textContent  = '週' + weeklyDebt.toFixed(1) + '時間という深刻な睡眠不足です。年間で' + Math.round(annualDebt) + '時間、約' + annualDays.toFixed(1) + '日分の睡眠不足が蓄積します。健康への影響が懸念されます。';
      barFill.className = 'bar-fill debt';
      barFill.style.width = '100%';
      barLabel.textContent = '睡眠負債の進行度(週7時間を100%とした目安)';
    }
  }

  function shareX() {
    if (!lastResult) return;
    var r = lastResult;
    var text;
    if (r.weeklyDebt <= 0) {
      text = '睡眠負債チェック結果: 平日' + r.weekday + 'h・休日' + r.weekend + 'hで睡眠充足。目標' + r.target + '時間をクリアできています。 #AIアプリ工房';
    } else {
      text = '私の睡眠負債: 週' + r.weeklyDebt.toFixed(1) + '時間ペースで積み重なり、年間では約' + Math.round(r.annualDebt) + '時間(' + r.annualDays.toFixed(1) + '日分)の睡眠不足。(平日' + r.weekday + 'h・休日' + r.weekend + 'h/目標' + r.target + 'h) #AIアプリ工房';
    }
    var url = 'https://yama-ai-factory.vercel.app/apps/sleep-debt/';
    window.open('https://x.com/intent/tweet?text=' + encodeURIComponent(text) + '&url=' + encodeURIComponent(url), '_blank', 'noopener');
  }

  calculate();
</script>
</body>
</html>
