<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>毎日のランチ代 年間換算機 | AIアプリ工房</title>
  <meta name="description" content="外食・コンビニ・弁当の月の回数と1回あたりの金額を入力するだけで、月・年間のランチ代合計と節約シミュレーションを即計算。物価高時代の昼食費見直しに。無料・登録不要。">

  <meta property="og:title" content="毎日のランチ代 年間換算機 | AIアプリ工房">
  <meta property="og:description" content="外食・コンビニ・弁当の月の回数と1回あたりの金額を入力するだけで、月・年間のランチ代合計と節約シミュレーションを即計算。物価高時代の昼食費見直しに。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://yama-ai-factory.vercel.app/apps/lunch-cost/">
  <meta name="twitter:card" content="summary">

  <script defer src="/_vercel/insights/script.js"></script>

  <style>
    :root {
      --bg:#07070f; --s1:#0e0e1a; --s2:#13131f; --bd:#22223a;
      --tx:#f0f0fa; --tx2:#6868a0; --tx3:#9090c0;
      --acc:#7c6ff5; --acc2:#a89cf7; --green:#34d399; --blue:#60a5fa;
      --yellow:#fbbf24; --red:#f87171;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background:var(--bg); color:var(--tx);
      font-family:'Segoe UI','Hiragino Sans','Yu Gothic UI',system-ui,sans-serif;
      min-height:100vh;
    }
    .wrapper { max-width:600px; margin:0 auto; padding:40px 20px 80px; }
    .back { font-size:.82rem; color:var(--tx2); text-decoration:none; display:inline-block; margin-bottom:28px; }
    .back:hover { color:var(--acc2); }
    .badge {
      display:inline-block; font-size:.72rem; font-weight:800; letter-spacing:.15em;
      text-transform:uppercase; color:var(--acc2);
      background:rgba(124,111,245,.15); border:1px solid rgba(124,111,245,.35);
      padding:4px 14px; border-radius:999px; margin-bottom:14px;
    }
    h1 { font-size:clamp(1.5rem,5vw,2.1rem); font-weight:900; line-height:1.3; margin-bottom:10px; }
    .grad { background:linear-gradient(135deg,#a89cf7,#60a5fa); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .subtitle { color:var(--tx3); font-size:.88rem; line-height:1.8; margin-bottom:28px; }
    .card { background:var(--s1); border:1px solid var(--bd); border-radius:16px; padding:24px 22px; margin-bottom:16px; }
    .card-title { font-size:.78rem; font-weight:700; color:var(--tx3); text-transform:uppercase; letter-spacing:.08em; margin-bottom:20px; }
    .meal-section { margin-bottom:20px; }
    .meal-header {
      display:flex; align-items:center; gap:8px;
      font-size:.88rem; font-weight:700; color:var(--tx); margin-bottom:12px;
    }
    .meal-dot { width:9px; height:9px; border-radius:50%; flex-shrink:0; }
    .field { margin-bottom:12px; }
    .field label { display:block; font-size:.82rem; color:var(--tx3); font-weight:600; margin-bottom:6px; }
    .input-row { display:flex; align-items:center; gap:10px; }
    input[type=number] {
      width:88px; padding:9px 10px; font-size:.95rem; font-weight:700;
      background:var(--s2); border:1px solid var(--bd); border-radius:10px;
      color:var(--tx); outline:none; transition:border-color .15s; text-align:center;
      flex-shrink:0; -moz-appearance:textfield;
    }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { opacity:.5; }
    input[type=number]:focus { border-color:var(--acc); }
    input[type=range] { flex:1; accent-color:var(--acc); cursor:pointer; min-width:60px; }
    .input-unit { font-size:.82rem; color:var(--tx2); white-space:nowrap; }
    .divider { border:none; border-top:1px solid var(--bd); margin:20px 0; }
    .calc-btn {
      width:100%; background:var(--acc); color:#fff; border:none; border-radius:10px;
      padding:13px; font-size:1rem; font-weight:700; cursor:pointer;
      transition:opacity .15s; margin-top:8px;
    }
    .calc-btn:hover { opacity:.85; }
    .rh { display:none; }
    .totals-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:20px; }
    .tot-box {
      background:var(--s2); border:1px solid var(--bd); border-radius:12px;
      padding:16px 14px; text-align:center;
    }
    .tot-lbl { font-size:.72rem; color:var(--tx2); margin-bottom:8px; font-weight:600; letter-spacing:.05em; }
    .tot-val { font-size:clamp(1.6rem,5vw,2.3rem); font-weight:900; color:var(--acc2); line-height:1.1; }
    .tot-unit { font-size:.75rem; color:var(--tx3); margin-top:6px; }
    .bd-table { width:100%; border-collapse:collapse; }
    .bd-table td { padding:9px 4px; font-size:.84rem; border-bottom:1px solid rgba(34,34,58,.6); vertical-align:middle; }
    .bd-table tr:last-child td { border-bottom:none; }
    .bd-lbl { color:var(--tx3); }
    .bd-dot { width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:5px; vertical-align:middle; }
    .bd-val { text-align:right; font-weight:700; white-space:nowrap; }
    .bd-total td { font-weight:800; border-top:2px solid var(--bd); border-bottom:none; padding-top:12px; }
    .savings-item {
      display:flex; justify-content:space-between; align-items:flex-start; gap:12px;
      padding:12px 0; border-bottom:1px solid rgba(34,34,58,.6);
    }
    .savings-item:last-child { border-bottom:none; padding-bottom:0; }
    .savings-lbl { font-size:.84rem; color:var(--tx3); line-height:1.55; flex:1; }
    .savings-amount { font-size:.95rem; font-weight:800; color:var(--green); white-space:nowrap; text-align:right; }
    .savings-amount.highlight { color:var(--yellow); font-size:1.05rem; }
    .share-btn {
      display:block; width:100%; padding:13px; border-radius:10px;
      background:var(--acc); border:none; color:#fff;
      font-size:1rem; font-weight:700; cursor:pointer; transition:opacity .15s;
    }
    .share-btn:hover { opacity:.85; }
    .copy-btn {
      display:block; width:100%; padding:11px; border-radius:10px;
      background:transparent; border:1px solid var(--bd); color:var(--tx3);
      font-size:.9rem; font-weight:600; cursor:pointer; transition:all .15s; margin-top:8px;
    }
    .copy-btn:hover { border-color:var(--acc2); color:var(--acc2); }
    @media (max-width:520px) {
      .wrapper { padding:28px 14px 60px; }
      input[type=number] { width:76px; font-size:.88rem; }
    }
  </style>
</head>
<body>
<div class="wrapper">
  <a class="back" href="/">&larr; AIアプリ工房トップへ</a>

  <div class="badge">生活費・節約</div>
  <h1><span class="grad">毎日のランチ代</span><br>年間換算機</h1>
  <p class="subtitle">外食・コンビニ・弁当の月の回数と1回あたりの金額を入力するだけで、月・年間のランチ代合計と節約シミュレーションを即計算します。</p>

  <div class="card">
    <div class="card-title">昼食の内訳を入力</div>

    <div class="meal-section">
      <div class="meal-header">
        <span class="meal-dot" style="background:var(--red)"></span>外食（レストラン・定食屋など）
      </div>
      <div class="field">
        <label>月の回数</label>
        <div class="input-row">
          <input type="number" id="r-n" value="8" min="0" max="31" step="1"
            onkeydown="if(event.key==='Enter')calculate();" oninput="calculate();">
          <span class="input-unit">回 / 月</span>
        </div>
      </div>
      <div class="field" style="margin-bottom:0;">
        <label>1回あたりの金額</label>
        <div class="input-row">
          <input type="number" id="r-p" value="1000" min="0" max="5000" step="50"
            onkeydown="if(event.key==='Enter')calculate();" oninput="syncSl('r'); calculate();">
          <input type="range" id="r-sl" min="300" max="3000" step="50" value="1000"
            oninput="syncNum('r'); calculate();">
          <span class="input-unit">円</span>
        </div>
      </div>
    </div>

    <div class="divider"></div>

    <div class="meal-section">
      <div class="meal-header">
        <span class="meal-dot" style="background:var(--yellow)"></span>コンビニ・テイクアウト
      </div>
      <div class="field">
        <label>月の回数</label>
        <div class="input-row">
          <input type="number" id="c-n" value="7" min="0" max="31" step="1"
            onkeydown="if(event.key==='Enter')calculate();" oninput="calculate();">
          <span class="input-unit">回 / 月</span>
        </div>
      </div>
      <div class="field" style="margin-bottom:0;">
        <label>1回あたりの金額</label>
        <div class="input-row">
          <input type="number" id="c-p" value="650" min="0" max="3000" step="50"
            onkeydown="if(event.key==='Enter')calculate();" oninput="syncSl('c'); calculate();">
          <input type="range" id="c-sl" min="200" max="1500" step="50" value="650"
            oninput="syncNum('c'); calculate();">
          <span class="input-unit">円</span>
        </div>
      </div>
    </div>

    <div class="divider"></div>

    <div class="meal-section" style="margin-bottom:4px;">
      <div class="meal-header">
        <span class="meal-dot" style="background:var(--green)"></span>手作り弁当・社食・食事手当あり
      </div>
      <div class="field">
        <label>月の回数</label>
        <div class="input-row">
          <input type="number" id="b-n" value="5" min="0" max="31" step="1"
            onkeydown="if(event.key==='Enter')calculate();" oninput="calculate();">
          <span class="input-unit">回 / 月</span>
        </div>
      </div>
      <div class="field" style="margin-bottom:0;">
        <label>1回あたりの実費（材料費など。食事手当で全額補助の場合は 0）</label>
        <div class="input-row">
          <input type="number" id="b-p" value="200" min="0" max="1000" step="50"
            onkeydown="if(event.key==='Enter')calculate();" oninput="syncSl('b'); calculate();">
          <input type="range" id="b-sl" min="0" max="600" step="50" value="200"
            oninput="syncNum('b'); calculate();">
          <span class="input-unit">円</span>
        </div>
      </div>
    </div>

    <button type="button" class="calc-btn" onclick="calculate()">計算する</button>
  </div>

  <div id="resultSection" class="rh">

    <div class="card">
      <div class="card-title">月・年間のランチ代</div>
      <div class="totals-grid">
        <div class="tot-box">
          <div class="tot-lbl">月間合計</div>
          <div class="tot-val" id="disp-monthly">0</div>
          <div class="tot-unit">円 / 月</div>
        </div>
        <div class="tot-box">
          <div class="tot-lbl">年間合計</div>
          <div class="tot-val" id="disp-annual">0</div>
          <div class="tot-unit">万円 / 年</div>
        </div>
      </div>
      <table class="bd-table">
        <tr>
          <td class="bd-lbl"><span class="bd-dot" style="background:var(--red)"></span>外食</td>
          <td class="bd-val" id="td-r">—</td>
        </tr>
        <tr>
          <td class="bd-lbl"><span class="bd-dot" style="background:var(--yellow)"></span>コンビニ</td>
          <td class="bd-val" id="td-c">—</td>
        </tr>
        <tr>
          <td class="bd-lbl"><span class="bd-dot" style="background:var(--green)"></span>弁当・社食</td>
          <td class="bd-val" id="td-b">—</td>
        </tr>
        <tr class="bd-total">
          <td class="bd-lbl">合計</td>
          <td class="bd-val" style="color:var(--acc2)" id="td-total">—</td>
        </tr>
      </table>
    </div>

    <div class="card">
      <div class="card-title">節約シミュレーション</div>
      <div id="savings-area"></div>
    </div>

    <div class="card">
      <button type="button" class="share-btn" onclick="doShare()">Xでシェアする</button>
      <button type="button" class="copy-btn" onclick="doCopy(this)">テキストをコピー</button>
    </div>

  </div>
</div>

<script>
var _st = '';

function syncSl(k) {
  document.getElementById(k + '-sl').value = document.getElementById(k + '-p').value;
}
function syncNum(k) {
  document.getElementById(k + '-p').value = document.getElementById(k + '-sl').value;
}

function fmtYen(v) {
  return v.toLocaleString('ja-JP') + '円';
}
function fmtMan(v) {
  if (v < 10000) return v.toLocaleString('ja-JP') + '円';
  return (Math.round(v / 1000) / 10).toLocaleString('ja-JP') + '万円';
}

function calculate() {
  var rN = Math.max(0, parseInt(document.getElementById('r-n').value) || 0);
  var rP = Math.max(0, parseInt(document.getElementById('r-p').value) || 0);
  var cN = Math.max(0, parseInt(document.getElementById('c-n').value) || 0);
  var cP = Math.max(0, parseInt(document.getElementById('c-p').value) || 0);
  var bN = Math.max(0, parseInt(document.getElementById('b-n').value) || 0);
  var bP = Math.max(0, parseInt(document.getElementById('b-p').value) || 0);

  var rM = rN * rP;
  var cM = cN * cP;
  var bM = bN * bP;
  var totM = rM + cM + bM;
  var totY = totM * 12;
  var totYMan = Math.round(totY / 1000) / 10;

  document.getElementById('disp-monthly').textContent = totM.toLocaleString('ja-JP');
  document.getElementById('disp-annual').textContent = totYMan.toLocaleString('ja-JP');

  document.getElementById('td-r').textContent = fmtYen(rM) + ' / 月';
  document.getElementById('td-c').textContent = fmtYen(cM) + ' / 月';
  document.getElementById('td-b').textContent = fmtYen(bM) + ' / 月';
  document.getElementById('td-total').textContent = fmtYen(totM) + ' / 月';

  var svRtoB = (rN > 0 && rP > bP) ? (rP - bP) * rN * 12 : 0;
  var svCtoB = (cN > 0 && cP > bP) ? (cP - bP) * cN * 12 : 0;
  var svAll  = svRtoB + svCtoB;

  var html = '';
  if (rN > 0 && rP > bP) {
    html += '<div class="savings-item">'
      + '<div class="savings-lbl">外食(' + rN + '回/月)をすべて弁当に切り替え</div>'
      + '<div class="savings-amount">年間 ' + fmtMan(svRtoB) + ' の節約</div>'
      + '</div>';
  }
  if (cN > 0 && cP > bP) {
    html += '<div class="savings-item">'
      + '<div class="savings-lbl">コンビニ(' + cN + '回/月)をすべて弁当に切り替え</div>'
      + '<div class="savings-amount">年間 ' + fmtMan(svCtoB) + ' の節約</div>'
      + '</div>';
  }
  if (svAll > 0) {
    html += '<div class="savings-item">'
      + '<div class="savings-lbl">外食+コンビニをすべて弁当に切り替えた場合（最大節約）</div>'
      + '<div class="savings-amount highlight">年間 ' + fmtMan(svAll) + ' の節約</div>'
      + '</div>';
  }
  if (html === '') {
    html = '<div style="font-size:.84rem;color:var(--tx3);padding:6px 0;">弁当中心の昼食スタイルです。すでに節約効果が高い状態です。</div>';
  }
  document.getElementById('savings-area').innerHTML = html;

  _st = '【毎日のランチ代 年間換算機】\n'
    + '外食 ' + rN + '回(' + rP + '円) / コンビニ ' + cN + '回(' + cP + '円) / 弁当 ' + bN + '回(' + bP + '円)\n'
    + '月間ランチ代: ' + fmtYen(totM) + '  /  年間: 約' + totYMan + '万円\n';
  if (svAll > 0) {
    _st += '弁当に切り替えると年間 ' + fmtMan(svAll) + ' の節約に！\n';
  }
  _st += '#ランチ代 #節約 #AIアプリ工房\n'
    + 'https://yama-ai-factory.vercel.app/apps/lunch-cost/';

  document.getElementById('resultSection').classList.remove('rh');
}

function doShare() {
  if (!_st) return;
  window.open('https://x.com/intent/tweet?text=' + encodeURIComponent(_st), '_blank', 'noopener');
}

function doCopy(btn) {
  if (!_st) return;
  navigator.clipboard.writeText(_st).then(function() {
    btn.textContent = 'コピーしました';
    setTimeout(function() { btn.textContent = 'テキストをコピー'; }, 2000);
  }).catch(function() {
    var ta = document.createElement('textarea');
    ta.value = _st;
    ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0;';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    btn.textContent = 'コピーしました';
    setTimeout(function() { btn.textContent = 'テキストをコピー'; }, 2000);
  });
}

calculate();
</script>
</body>
</html>
