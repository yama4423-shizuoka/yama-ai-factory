<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>時給・日給・月給・年収換算機 | AIアプリ工房</title>
  <meta name="description" content="時給・日給・月給・年収をどれか1つ入力するだけで残り3つを即換算。求人票の比較・副業案件の評価・給与交渉の確認に。無料・登録不要。">

  <meta property="og:title" content="時給・日給・月給・年収換算機 | AIアプリ工房">
  <meta property="og:description" content="時給・日給・月給・年収をどれか1つ入力するだけで残り3つを即換算。求人票の比較・副業案件の評価・給与交渉の確認に。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://yama-ai-factory.vercel.app/apps/wage-converter/">
  <meta name="twitter:card" content="summary">

  <script defer src="/_vercel/insights/script.js"></script>

  <style>
    :root {
      --bg:#07070f; --s1:#0e0e1a; --s2:#13131f; --bd:#22223a;
      --tx:#f0f0fa; --tx2:#6868a0; --tx3:#9090c0;
      --acc:#7c6ff5; --acc2:#a89cf7; --green:#34d399; --blue:#60a5fa;
      --yellow:#fbbf24; --red:#f87171;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background:var(--bg); color:var(--tx);
      font-family:'Segoe UI','Hiragino Sans','Yu Gothic UI',system-ui,sans-serif;
      min-height:100vh;
    }
    .wrapper { max-width:600px; margin:0 auto; padding:40px 20px 80px; }
    .back { font-size:.82rem; color:var(--tx2); text-decoration:none; display:inline-block; margin-bottom:28px; }
    .back:hover { color:var(--acc2); }
    .badge {
      display:inline-block; font-size:.72rem; font-weight:800; letter-spacing:.15em;
      text-transform:uppercase; color:var(--acc2);
      background:rgba(124,111,245,.15); border:1px solid rgba(124,111,245,.35);
      padding:4px 14px; border-radius:999px; margin-bottom:14px;
    }
    h1 { font-size:clamp(1.5rem,5vw,2.1rem); font-weight:900; line-height:1.3; margin-bottom:10px; }
    .grad { background:linear-gradient(135deg,#a89cf7,#60a5fa); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .subtitle { color:var(--tx3); font-size:.88rem; line-height:1.8; margin-bottom:28px; }

    .card { background:var(--s1); border:1px solid var(--bd); border-radius:16px; padding:24px 22px; margin-bottom:16px; }
    .card-title { font-size:.78rem; font-weight:700; color:var(--tx3); text-transform:uppercase; letter-spacing:.08em; margin-bottom:18px; }

    .field { margin-bottom:16px; }
    .field:last-child { margin-bottom:0; }
    .field label { display:block; font-size:.84rem; color:var(--tx3); font-weight:600; margin-bottom:6px; }
    .input-wrap { display:flex; align-items:center; gap:10px; }
    input[type=number] {
      flex:1; background:var(--s2); border:1.5px solid var(--bd); border-radius:10px;
      color:var(--tx); padding:11px 14px; font-size:1rem;
      outline:none; transition:border-color .15s;
      -moz-appearance:textfield;
    }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance:none; }
    input[type=number]:focus { border-color:var(--acc); }
    input[type=number].is-source { border-color:var(--acc); background:rgba(124,111,245,.06); }
    .unit { font-size:.82rem; color:var(--tx2); white-space:nowrap; min-width:62px; }

    .settings-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }

    .result-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .result-item {
      background:var(--s2); border:1px solid var(--bd); border-radius:12px;
      padding:16px;
    }
    .result-item.active {
      border-color:rgba(124,111,245,.5);
      background:rgba(124,111,245,.08);
    }
    .result-label { font-size:.72rem; color:var(--tx3); font-weight:700; letter-spacing:.07em; margin-bottom:6px; }
    .result-value { font-size:1.35rem; font-weight:900; color:var(--tx); line-height:1.2; }
    .result-value .unit-sm { font-size:.78rem; font-weight:400; color:var(--tx3); margin-left:2px; }
    .result-note { font-size:.7rem; color:var(--tx2); margin-top:5px; }

    .btn {
      display:inline-flex; align-items:center; gap:8px;
      padding:12px 22px; border-radius:10px; font-weight:700; font-size:.88rem;
      cursor:pointer; border:none; transition:all .15s; text-decoration:none;
    }
    .btn-primary { background:var(--acc); color:#fff; }
    .btn-primary:hover { background:#6a5fe0; }
    .btn-row { display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }

    .notice { font-size:.74rem; color:var(--tx2); line-height:1.7; margin-top:12px; padding-top:12px; border-top:1px solid var(--bd); }

    footer { margin-top:48px; padding-top:20px; border-top:1px solid var(--bd); text-align:center; font-size:.78rem; color:var(--tx2); line-height:2; }
    footer a { color:var(--acc2); text-decoration:none; }

    @media (max-width:520px) {
      .wrapper { padding:28px 14px 60px; }
      .result-value { font-size:1.15rem; }
      .settings-row { grid-template-columns:1fr 1fr; }
    }
  </style>
</head>
<body>
<div class="wrapper">
  <a class="back" href="/">&larr; AIアプリ工房</a>
  <div class="badge">Wage Converter</div>
  <h1><span class="grad">時給・日給・月給・年収</span><br>換算機</h1>
  <p class="subtitle">どれか1つを入力すると残り3つを即換算。<br>求人票の比較・副業案件の評価・給与交渉の確認に使えます。</p>

  <div class="card">
    <div class="card-title">計算条件</div>
    <div class="settings-row">
      <div class="field">
        <label>1日の労働時間</label>
        <div class="input-wrap">
          <input type="number" id="hoursPerDay" value="8" min="1" max="24" step="0.5"
            oninput="recalcFromSource()" onkeydown="if(event.key==='Enter')recalcFromSource();">
          <span class="unit">時間/日</span>
        </div>
      </div>
      <div class="field">
        <label>月間労働日数</label>
        <div class="input-wrap">
          <input type="number" id="daysPerMonth" value="20" min="1" max="31" step="1"
            oninput="recalcFromSource()" onkeydown="if(event.key==='Enter')recalcFromSource();">
          <span class="unit">日/月</span>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">金額を入力</div>
    <div class="field">
      <label>時給</label>
      <div class="input-wrap">
        <input type="number" id="inp-hourly" placeholder="例: 1500" min="0"
          oninput="convertFrom('hourly')" onkeydown="if(event.key==='Enter')convertFrom('hourly');">
        <span class="unit">円/時間</span>
      </div>
    </div>
    <div class="field">
      <label>日給</label>
      <div class="input-wrap">
        <input type="number" id="inp-daily" placeholder="例: 12000" min="0"
          oninput="convertFrom('daily')" onkeydown="if(event.key==='Enter')convertFrom('daily');">
        <span class="unit">円/日</span>
      </div>
    </div>
    <div class="field">
      <label>月給</label>
      <div class="input-wrap">
        <input type="number" id="inp-monthly" placeholder="例: 240000" min="0"
          oninput="convertFrom('monthly')" onkeydown="if(event.key==='Enter')convertFrom('monthly');">
        <span class="unit">円/月</span>
      </div>
    </div>
    <div class="field">
      <label>年収</label>
      <div class="input-wrap">
        <input type="number" id="inp-annual" placeholder="例: 2880000" min="0"
          oninput="convertFrom('annual')" onkeydown="if(event.key==='Enter')convertFrom('annual');">
        <span class="unit">円/年</span>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">換算結果</div>
    <div class="result-grid">
      <div class="result-item" id="res-hourly">
        <div class="result-label">時給</div>
        <div class="result-value" id="res-hourly-val">--<span class="unit-sm">円/時</span></div>
        <div class="result-note" id="res-hourly-note"></div>
      </div>
      <div class="result-item" id="res-daily">
        <div class="result-label">日給</div>
        <div class="result-value" id="res-daily-val">--<span class="unit-sm">円/日</span></div>
        <div class="result-note" id="res-daily-note"></div>
      </div>
      <div class="result-item" id="res-monthly">
        <div class="result-label">月給</div>
        <div class="result-value" id="res-monthly-val">--<span class="unit-sm">円/月</span></div>
        <div class="result-note" id="res-monthly-note"></div>
      </div>
      <div class="result-item" id="res-annual">
        <div class="result-label">年収</div>
        <div class="result-value" id="res-annual-val">--<span class="unit-sm">円/年</span></div>
        <div class="result-note" id="res-annual-note"></div>
      </div>
    </div>
    <div class="notice">
      ※ボーナス・各種手当は含みません。実際の手取りは所得税・社会保険料の控除後の金額になります。
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="shareBtn" onclick="share()" style="display:none;">Xでシェア</button>
    </div>
  </div>

  <footer>
    <a href="/">AIアプリ工房トップへ</a><br>
    計算結果はあくまで目安です。実際の給与はボーナスや諸手当により異なります。
  </footer>
</div>

<script>
  var sourceKey = null;

  function getParams() {
    var h = parseFloat(document.getElementById('hoursPerDay').value) || 8;
    var d = parseFloat(document.getElementById('daysPerMonth').value) || 20;
    return { h: h, d: d };
  }

  function fmt(n) {
    if (n === null || isNaN(n) || n < 0) return '--';
    return Math.round(n).toLocaleString('ja-JP');
  }

  function fmtDecimal(n) {
    if (n === null || isNaN(n) || n < 0) return '--';
    var rounded = Math.round(n * 10) / 10;
    return rounded % 1 === 0
      ? Math.round(rounded).toLocaleString('ja-JP')
      : rounded.toLocaleString('ja-JP', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  }

  function deriveAll(base, val, p) {
    var r = { hourly: 0, daily: 0, monthly: 0, annual: 0 };
    switch (base) {
      case 'hourly':
        r.hourly  = val;
        r.daily   = val * p.h;
        r.monthly = val * p.h * p.d;
        r.annual  = val * p.h * p.d * 12;
        break;
      case 'daily':
        r.daily   = val;
        r.hourly  = p.h > 0 ? val / p.h : 0;
        r.monthly = val * p.d;
        r.annual  = val * p.d * 12;
        break;
      case 'monthly':
        r.monthly = val;
        r.daily   = p.d > 0 ? val / p.d : 0;
        r.hourly  = (p.h > 0 && p.d > 0) ? val / (p.h * p.d) : 0;
        r.annual  = val * 12;
        break;
      case 'annual':
        r.annual  = val;
        r.monthly = val / 12;
        r.daily   = p.d > 0 ? (val / 12) / p.d : 0;
        r.hourly  = (p.h > 0 && p.d > 0) ? (val / 12) / (p.h * p.d) : 0;
        break;
    }
    return r;
  }

  function convertFrom(base) {
    var raw = document.getElementById('inp-' + base).value;
    var val = parseFloat(raw);

    if (raw === '' || isNaN(val) || val < 0) {
      sourceKey = null;
      clearResults();
      return;
    }

    sourceKey = base;
    var p = getParams();
    var r = deriveAll(base, val, p);

    var keys = ['hourly', 'daily', 'monthly', 'annual'];
    keys.forEach(function(k) {
      var inp = document.getElementById('inp-' + k);
      if (k !== base) {
        inp.value = Math.round(r[k]);
        inp.classList.remove('is-source');
      } else {
        inp.classList.add('is-source');
      }
    });

    renderResults(r, base, p);
    document.getElementById('shareBtn').style.display = 'inline-flex';
  }

  function renderResults(r, activeKey, p) {
    var notes = {
      hourly:  '',
      daily:   '1日' + p.h + '時間勤務ベース',
      monthly: '月' + p.d + '日勤務ベース',
      annual:  'ボーナスなし / 月給x12'
    };
    var keys = ['hourly', 'daily', 'monthly', 'annual'];
    var units = { hourly:'円/時', daily:'円/日', monthly:'円/月', annual:'円/年' };

    keys.forEach(function(k) {
      var card = document.getElementById('res-' + k);
      card.className = 'result-item' + (k === activeKey ? ' active' : '');

      var display = k === 'hourly' ? fmtDecimal(r[k]) : fmt(r[k]);
      document.getElementById('res-' + k + '-val').innerHTML =
        display + '<span class="unit-sm">' + units[k] + '</span>';
      document.getElementById('res-' + k + '-note').textContent = notes[k];
    });
  }

  function clearResults() {
    var keys = ['hourly', 'daily', 'monthly', 'annual'];
    var units = { hourly:'円/時', daily:'円/日', monthly:'円/月', annual:'円/年' };
    keys.forEach(function(k) {
      document.getElementById('res-' + k).className = 'result-item';
      document.getElementById('res-' + k + '-val').innerHTML =
        '--<span class="unit-sm">' + units[k] + '</span>';
      document.getElementById('res-' + k + '-note').textContent = '';
    });
    document.getElementById('shareBtn').style.display = 'none';
  }

  function recalcFromSource() {
    if (sourceKey) {
      convertFrom(sourceKey);
    }
  }

  function share() {
    if (!sourceKey) return;
    var val = parseFloat(document.getElementById('inp-' + sourceKey).value);
    if (isNaN(val)) return;

    var p = getParams();
    var r = deriveAll(sourceKey, val, p);

    var labels = { hourly:'時給', daily:'日給', monthly:'月給', annual:'年収' };
    var text =
      labels[sourceKey] + ' ' + fmtDecimal(r.hourly) + '円/時 を換算しました\n' +
      '時給 ' + fmtDecimal(r.hourly) + '円 / ' +
      '日給 ' + fmt(r.daily) + '円 / ' +
      '月給 ' + fmt(r.monthly) + '円 / ' +
      '年収 ' + fmt(r.annual) + '円\n' +
      '#AIアプリ工房\n' +
      'https://yama-ai-factory.vercel.app/apps/wage-converter/';

    window.open('https://x.com/intent/tweet?text=' + encodeURIComponent(text), '_blank');
  }

  // 初期値で自動計算
  document.getElementById('inp-hourly').value = 1500;
  convertFrom('hourly');
</script>
</body>
</html>
